# cargo-deny configuration. Run: cargo deny check advisories licenses
# from engine/. CI runs this on every push (see .github/workflows/ci.yml).

[advisories]
version = 2
yanked = "deny"
# The krilla/fontations migration (2026-07) removed both former exceptions
# (lopdf RUSTSEC-2026-0187, ttf-parser RUSTSEC-2026-0192) from the dependency
# tree entirely. Keep the list that short — a new ignore needs a written
# argument recorded beside the entry rather than carried as a bare exception.
ignore = [
    # unsafe-libyaml is UNMAINTAINED (its repository was archived), which is a
    # notice, not a vulnerability: the advisory names no flaw. It is the parser
    # under serde_yaml, which every authored-YAML door goes through, so it is
    # not removable without replacing serde_yaml itself. What the workspace
    # relies on from it is pinned by tests in engine/core/src/yaml/tests/
    # (the alias-expansion refusal at the tested input size; nesting is the
    # door's own bound), every host-reachable YAML door is capped at
    # MAX_INPUT_BYTES, and the one known exposure — alias amplification that
    # scales with input size — is documented in engine/core/src/yaml.rs. Drop this entry
    # with the move off serde_yaml.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained notice for unsafe-libyaml (serde_yaml's parser), not a vulnerability; see the comment above" },
]

[licenses]
version = 2
# Project license is MIT OR Apache-2.0 OR BSD-3-Clause; dependencies must
# stay within common permissive licenses compatible with all three.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
