# The English annotation layer for the key catalog.
#
# One entry per catalog node: `Shape` for a named shape, `Shape.property` for
# one of its keys. Flat because three wire keys are literally named
# `description`, so a nested envelope would collide with the data it describes.
#
# What belongs here: what the key MEANS, the CSS property it mirrors, what it
# does to the resolved box, and which diagnostics it can emit. What does not:
# which construct to reach for, worked examples, how features compose — those
# are narrative and stay in docs/engine/.
#
# `make reference:generate` merges these into catalog.schema.json as node-local
# `description`; the completeness gate refuses a node with no entry and an
# entry naming no node. A shape with a CLOSED value set must name every one of
# its values in backticks — that clause is what stops a description erring
# WIDE, which is the direction that misleads an agent into emitting input the
# parser rejects.

## style.md — appearance properties and the cascade

Style: >-
  The appearance property bag every item may carry. Every property is
  optional; unset means inherit (for inherited properties) or the engine
  default. Three surfaces resolve per item in precedence order — engine
  default, inherited ancestor, named `styles:` entries in listed order, then
  the inline `style:`. Unknown keys are parse errors.
Style.fontSize: >-
  Text size, in points or as a length string. Strings take `pt`/`mm`/`cm`/`in`,
  `em`/`%` of the INHERITED size (nested relative sizes multiply), or `rem` of
  the engine default. Inherited; defaults to 10. Non-positive or non-finite
  falls back with `invalid_font_size`; over 1000 pt with
  `font_size_out_of_range`.
Style.fontFamily: >-
  The face id to draw with, resolved against the loaded font packs. Inherited;
  defaults to the pack's own default face. An id no pack ships warns
  `unknown_font_family`.
Style.fontWeight: >-
  Mirrors CSS `font-weight`, as a two-value subset. `bold` selects the family's
  real bold face when it ships one, otherwise synthetic emboldening — glyphs
  stroked in the text colour, advances unchanged. Inherited; defaults to
  `normal`.
Style.fontStyle: >-
  Mirrors CSS `font-style`, as a two-value subset. `italic` is a synthetic
  baseline-anchored skew of about 12 degrees with advances unchanged; no real
  italic face is selected. Inherited; defaults to `normal`.
Style.letterSpacing: >-
  Mirrors CSS `letter-spacing`. Added to every character advance, so
  measurement, wrapping, alignment and drawing share one policy. Points or a
  length string taking `pt`/`mm`/`cm`/`in` or `em`/`rem`, where `em` is the
  item's own computed size; `%` is a parse error, as in CSS. Negative values
  are allowed. Inherited; defaults to 0. Magnitude over 1000 pt falls back to 0
  with `invalid_letter_spacing`.
Style.lineHeight: >-
  Mirrors CSS `line-height` in its unitless form: a multiplier of the computed
  font size, which sets the line box height. Inherited; defaults to 1.4.
  Non-positive or non-finite falls back with `invalid_line_height`; over 1000
  with `line_height_out_of_range`.
Style.color: >-
  Text colour as an `#rrggbb` string. Inherited; defaults to black. Any other
  spelling warns `invalid_color` and draws the default.
Style.textAlign: >-
  Mirrors CSS `text-align`. On a vertical block the keyword names the line's
  end along the column, so `right` is the bottom. A `char_grid` honours it to
  fill a partly filled line toward its end, but reads it from the item only,
  never inherited. Inherited; defaults to `left`.
Style.verticalAlign: >-
  Vertical alignment of content within the item's own box, which needs a
  definite height or `minHeight` slack to have room to act. On a vertical block
  it maps CSS-logically onto the column stack — top is the right edge, bottom
  the left. Not inherited; defaults to `top`.
Style.lineBreak: >-
  Mirrors CSS `line-break`. `normal`, `strict` and `loose` pick the CJK kinsoku
  strictness; `anywhere` breaks between any two characters with no kinsoku at
  all. Inherited; defaults to `normal`.
Style.textSpacingTrim: >-
  Mirrors CSS `text-spacing-trim`, as a subset. Trims the internal space
  between adjacent fullwidth punctuation glyphs to half-width. Synthesized
  after shaping, so it works on every face rather than depending on font
  features. Inherited; defaults to `space_all`, which trims nothing.
Style.hangingPunctuation: >-
  Mirrors CSS `hanging-punctuation`, as a subset over line-terminating commas
  and full stops. Lets such a character hang past the end edge rather than
  forcing a wrap. Inherited; defaults to `none`.
Style.backgroundColor: >-
  A filled rectangle covering the border box, painted under the item's content.
  An `#rrggbb` string; not inherited, and unset paints nothing. Honoured on
  text-drawing items, `container`, `repeat` cells, `image` and `qr_code`.
Style.borderWidth: >-
  Border stroke width over the border box, in points, as one number for all
  four sides or a per-side map whose unset sides are 0. A side draws only where
  its computed width is above 0. Does NOT change geometry — each side is drawn
  centred on the box edge. Not inherited; defaults to 0. Negative widths are
  parse errors; over 1000 pt falls back with `invalid_border_width`.
Style.borderColor: >-
  Border stroke colour, as one `#rrggbb` string or a per-side map. Inert while
  the side's width is 0, so a named style can carry a palette colour that items
  opt into by giving a width. Not inherited; defaults to black.
Style.borderStyle: >-
  Border stroke pattern, as one keyword or a per-side map. `double` splits the
  side's width into two lines of a third each, as CSS does. Not inherited;
  defaults to `solid`.
Style.borderRadius: >-
  Mirrors CSS `border-radius`, as a single value for all four corners — there
  is no per-corner form. `%` resolves against both axes independently, so `50%`
  is a circle on a square box. An absolute radius too large to fit shrinks by
  one uniform factor, the CSS overlapping-curves rule, which is what makes a
  large value a stadium rather than an ellipse. Not inherited; defaults to 0.
  Refused with `border_radius_ignored` on a per-side or `double` border, a
  `table` and the form marks; negative or non-finite warns
  `invalid_border_radius`.
Style.textOverflow: >-
  What text does when it exceeds a DEFINITE box height; an auto-height box
  grows instead and never consults this. On a vertical block the overflow axis
  is the box width. Not inherited; defaults to `visible`.
Style.overflow: >-
  Mirrors CSS `overflow`, deciding what a container-like box does with children
  outside its border box. `hidden` clips children to the border box and
  suppresses `container_overflow`; decoration stays outside, because it IS the
  box. Inert on items that are not container-like — text uses `textOverflow`
  instead. Not inherited; defaults to `visible`.
Style.textDecoration: >-
  Mirrors CSS `text-decoration-line`, as a single-keyword subset. Position and
  thickness come from the font's own metrics, drawn in the text colour and
  sized to each measured line. Not inherited, matching CSS, since decoration
  PROPAGATION is not modelled — set it on the text item itself. Defaults to
  `none`.
Style.opacity: >-
  Paint alpha from 0 to 1 for the item's own painting — glyphs, decoration
  line, background fill and border stroke alike. Per-item alpha, NOT CSS group
  compositing: nested items do not multiply, and a container's opacity does not
  reach its children. QR modules ignore it, to protect scannability. Not
  inherited; defaults to 1. Out of range warns `invalid_opacity` and draws
  opaque.
Style.writingMode: >-
  Mirrors CSS `writing-mode`, as a two-value subset. `vertical_rl` turns a text
  item into a vertical block — characters fill top to bottom and columns lay
  out right to left. Honoured on every text surface; a text `mark:` is the one
  warned fallback, `vertical_text_unsupported`. Inherited; defaults to
  `horizontal_tb`.
Style.textOrientation: >-
  Mirrors CSS `text-orientation`, as a subset, and is consulted only inside a
  vertical block. Inherited; defaults to `mixed`.
Style.textCombineUpright: >-
  Mirrors CSS `text-combine-upright`, as a subset — tate-chu-yoko. `none`
  combines nothing; `{ digits: n }` with n from 2 to 4 makes runs of up to n
  consecutive ASCII digits share one upright cell of a vertical column; `all`
  combines the whole styled scope into one cell, which is meant for a short
  span. Longer runs stay uncombined; out-of-range digits and unknown keywords
  are parse errors. Inert in horizontal text. Inherited; defaults to `none`.
BorderColor: >-
  A border colour: one `#rrggbb` string for all four sides, or a map naming
  `top`, `right`, `bottom` and `left` individually. An unset side in the map
  inherits nothing — it simply has no colour of its own.
BorderStyle: >-
  A border stroke pattern: one keyword for all four sides, or a map naming
  `top`, `right`, `bottom` and `left` individually.
BorderStyleKind: >-
  One border stroke pattern. `solid` is a continuous line; `double` splits the
  side's width into two lines of a third each; `dashed` paints three stroke
  widths on and three off; `dotted` paints one and one. Dash intervals are
  floored at 0.25 pt so a hair-thin border cannot explode the dash walk.
BorderWidth: >-
  A border stroke width in points: one number for all four sides, or a map
  naming `top`, `right`, `bottom` and `left` individually, whose unset sides
  are 0.
FontStyle: >-
  A font style keyword. `normal` is upright; `italic` is a synthetic
  baseline-anchored skew rather than a real italic face.
FontWeight: >-
  A font weight keyword. `normal` is the regular face; `bold` selects a real
  bold face where the family ships one and synthesizes emboldening otherwise.
HangingPunctuation: >-
  How a line-terminating comma or full stop may hang past the end edge. `none`
  never hangs; `allow_end` hangs one that would otherwise wrap, keeping the
  line count down; `force_end` also excludes a FITTING trailing comma from the
  alignment width, so it hangs into the margin under centre or right alignment.
LineBreak: >-
  CJK line-breaking strictness. `normal` is the ordinary kinsoku set; `strict`
  additionally holds small kana and the prolonged-sound and wave marks off a
  line start; `loose` frees centred punctuation and inseparables; `anywhere`
  breaks between any two characters with no kinsoku at all.
Overflow: >-
  What a container-like box does with children outside its border box.
  `visible` lets them paint outside and reports `container_overflow`; `hidden`
  clips them to the border box and suppresses that diagnostic.
TextAlign: >-
  Inline alignment within the line box. `left` and `right` name the block's
  start and end edges, and `center` splits the remaining space; on a vertical
  block those edges are the column's top and bottom.
TextCombineUpright: >-
  Tate-chu-yoko: `none` combines nothing, `all` combines the whole styled scope
  into one upright cell, and the map form `{ digits: n }` combines runs of up
  to n consecutive ASCII digits, with n from 2 to 4.
TextDecoration: >-
  A decoration line drawn on text. `none` draws nothing; `underline` draws
  below the baseline; `line_through` draws across the glyphs. On a vertical
  block an underline becomes the side line right of the em cell, following the
  JLREQ convention.
TextOrientation: >-
  How characters sit inside a vertical column. `mixed` keeps CJK and kana
  upright and rotates Latin and digits 90 degrees clockwise; `upright` keeps
  every character upright.
TextOverflow: >-
  What text does when it exceeds a definite box height. `visible` overflows and
  reports it; `shrink` reduces the computed font size until the content fits;
  `ellipsis` truncates and appends an ellipsis; `clip` cuts at the box edge
  with no marker.
TextSpacingTrim: >-
  How the internal space around fullwidth punctuation is trimmed. `space_all`
  trims nothing, leaving output unchanged; `normal` trims the space between two
  adjacent fullwidth punctuation glyphs to half-width; `trim_start` also trims
  a fullwidth opening bracket sitting at a line head.
VerticalAlign: >-
  Block-axis alignment of content within the item's box. `top`, `middle` and
  `bottom` name the box's start, centre and end; on a vertical block they map
  CSS-logically onto the column stack, so `top` is the right edge.

## definitions.md — the data dictionary

Definitions: >-
  The root of `definitions.yml`: an OpenAPI-style schema isomorphic to the
  params JSON, so the same nesting describes both. Not required to render — it
  enriches `validate` and tells the formatter a field's type instead of leaving
  it to guess from the JSON value. Advertised as the `definitions.schema`
  capability key.
Definitions.version: >-
  The definitions wire version this file is authored against. Optional; the
  engine accepts the file either way and uses it only to report a mismatch.
Definitions.type: >-
  The root schema's type. Required, and always `object` — a definitions file
  describes a params object, never a bare scalar or array at the top.
Definitions.title: >-
  A display name for the document's data as a whole, used by authoring tools.
  Never rendered into a PDF.
Definitions.description: >-
  Prose about the document's data as a whole, for authoring tools and human
  readers. Never rendered into a PDF.
Definitions.required: >-
  Top-level params keys that must be present and non-null. A violation warns
  `params_missing_required` during `validate` and does not stop the render.
Definitions.properties: >-
  The declared top-level fields, keyed by params key. A property whose type is
  `object` is a field group; one whose type is `array` is the data source a
  `table`, `repeat`, `repeat_flow` or `list` binds. A file with no properties
  makes every binding read as unknown and reports `empty_definitions` once.
Schema: >-
  One declared field, at any depth. The vocabulary is JSON Schema's, narrowed
  to what this engine consumes, plus the presentation keys an author needs —
  `displayFormat`, `displayFormats`, `placeholder` and `recommendedStyle`.
  Schemas nest at most 16 levels and declare at most 4096 nodes.
Schema.type: >-
  Required. The field's base type, from JSON Schema's vocabulary. Combined with `format`
  it selects the engine field type that decides how a bound value is formatted.
Schema.format: >-
  A data-semantic hint, as an OPEN vocabulary. Known values — `date-time`,
  `date`, `image`, `currency`, `percentage`, `quantity` — refine how the engine
  formats the field. Unknown values are generation hints for authoring tools,
  leave the base type untouched and never warn. A known value on a base type it
  does not apply to keeps the base type and warns
  `definitions_format_ignored`.
Schema.title: >-
  A display name for this field, shown in an authoring tool's field palette and
  used as a row's display name on an array's `items` schema. Never rendered
  into a PDF.
Schema.description: >-
  Prose about this field, for authoring tools and human readers. Never rendered
  into a PDF.
Schema.example: >-
  A sample value for this field, used by authoring tools to generate params.
  Any JSON value; it is never validated against the field's own constraints and
  never reaches a render.
Schema.placeholder: >-
  Text drawn in place of a binding to this field when the value resolves blank
  — absent, `null` or the empty string. The blank-form convention: it makes a
  form print its ruled space rather than nothing.
Schema.displayFormat: >-
  The field's DEFAULT display variant, used when a placement picks none. The
  same names a binding's `format:` accepts.
Schema.displayFormats: >-
  The display variants declared for this field, which is the set a binding's
  `format:` may pick from and the list an authoring tool offers. A pick outside
  it — and outside the template's `formats:` registry, the currency variants,
  the `value` label escape and the type overrides — warns `unknown_format`.
Schema.enum: >-
  The declared value set. A member is a bare value, or a `{ value, label }`
  pair whose label is what a text placement PRINTS while params keep carrying
  the machine value. A value outside the set warns `params_enum_mismatch`,
  matched on the VALUE — labels never participate. At most 256 members,
  labelled or bare.
Schema.currency: >-
  The ISO currency code for a `format: currency` field, overriding the
  document's `defaults.currency` for this field alone.
Schema.precision: >-
  Decimal places for a numeric field, overriding the locale's own default for
  this field alone.
Schema.unit: >-
  The SEMANTIC unit key for a `format: quantity` field. The display words live
  in the locale pack, so adding a locale never edits this file.
Schema.minimum: >-
  The smallest value this number field accepts. A violation warns
  `params_out_of_range` during `validate` and does not stop the render.
Schema.maximum: >-
  The largest value this number field accepts. A violation warns
  `params_out_of_range` during `validate` and does not stop the render.
Schema.minLength: >-
  The shortest this string field may be, counted in CHARACTERS rather than
  bytes. A violation warns `params_length_out_of_range`.
Schema.maxLength: >-
  The longest this string field may be, counted in CHARACTERS rather than
  bytes. A violation warns `params_length_out_of_range`.
Schema.minItems: >-
  The fewest entries this array field may carry. A violation warns
  `params_length_out_of_range`. An empty array is not blank, so it stays
  subject to this bound.
Schema.maxItems: >-
  The most entries this array field may carry. A violation warns
  `params_length_out_of_range`.
Schema.required: >-
  The child keys that must be present and non-null on this object. A violation
  warns `params_missing_required`.
Schema.properties: >-
  This object field's declared children, keyed by params key.
Schema.items: >-
  The schema of ONE ENTRY in this array field. A row's own array child is a
  data source in its own right, bound row-relatively, and nesting is not
  limited to one level.
Schema.recommendedStyle: >-
  A style bag an authoring tool may apply when it places this field — the
  engineer's presentation hint, such as right-aligning an amount. Advisory: the
  engine never reads it at render time.
SchemaType: >-
  A field's base type, from JSON Schema's vocabulary. `string`, `number`,
  `integer`, `boolean`, `object` and `array` are the whole set; `integer`
  rejects a fractional params value where `number` accepts it.
EnumEntry: >-
  One member of a declared value set: a `{ value, label }` pair, or a bare
  value taken verbatim. The parser branches on whether the member is a MAP, so
  the bare form is anything else — a string, a number, a boolean, `null` or an
  array. The two forms mix freely in one list, and a member with no label falls
  back to printing its value.
LabeledEnumValue: >-
  The pair form of an enum member, declaring the machine value and the words a
  text placement prints for it. Labels apply to plain text fields only — on any
  other field type they warn `definitions_enum_labels_ignored` and the values
  render unlabelled.
LabeledEnumValue.value: >-
  Required. The machine value params carry and validation matches on. Must be a scalar; a
  container here is a parse error.
LabeledEnumValue.label: >-
  Required — the pair form exists to carry it. The words a text placement prints for this value. An empty string is
  authorable and renders empty — the VALUE is non-blank, so the blank-form
  placeholder does not fire.
FormatVariant: >-
  One entry in a field's `displayFormats` list: the variant id a binding may
  pick, with the words an authoring tool shows for it.
FormatVariant.id: >-
  Required. The variant id a binding's `format:` names. Must be a variant the engine can
  resolve for this field's type, or a name in the template's `formats:`
  registry.
FormatVariant.label: >-
  The words an authoring tool shows for this variant. Never rendered into a
  PDF.

## table.md — the data-driven table

Item.table: >-
  A data-driven table: one row per element of a bound array, and each column
  either binds a key relative to the row object or hosts a `cell:`
  sub-template. In the flow body it paginates row by row and repeats its
  header; placed anywhere else — a container child, an absolute body, a band, a
  grid cell — it renders as one bounded block that never paginates, and the
  pagination keys warn `table_pagination_key_ignored`. Not supported inside a
  cell (`table_in_cell`).
Item.table.id: >-
  A stable name for this table, adding a lookup alias beside its path in the
  `inspect` box index.
Item.table.box: >-
  The table's geometry. In the flow body it narrows the table horizontally —
  width, x offset, `auto` side margins to centre it — while y and height stay
  flow-owned. Everywhere else it places the table as one bounded block.
Item.table.visible: >-
  Whether this table is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.table.data: >-
  The array params key, one row per element. Required. A source that is not an
  array warns `not_an_array`; an absent one warns `missing_data`.
Item.table.columns: >-
  The table's columns, in the order they are drawn. Required.
Item.table.headerGroups: >-
  An optional spanning row drawn above the column labels, repeating with the
  header on every page. Cumulative span past the column count is clamped with
  `header_group_span_clamped`, and any uncovered columns become one unlabelled
  trailing cell.
Item.table.header: >-
  The header row's own height and styling.
Item.table.row: >-
  The body rows' height, styling, zebra layer and data-driven conditional
  layers.
Item.table.autoPageBreak: >-
  Whether rows that do not fit continue on the next page. Defaults to true;
  with false, an overflowing row warns `row_overflow`. Inert outside a flow
  body.
Item.table.repeatHeader: >-
  Whether the header row is redrawn on continuation pages. Defaults to true.
  Inert outside a flow body.
Item.table.keepTogether: >-
  Whether a table that would split, but would fit whole on one page, breaks to
  a fresh page first. Defaults to false. A table taller than a page paginates
  as usual either way. Inert outside a flow body.
Item.table.emptyBehavior: >-
  What an empty bound array produces. Defaults to `collapse`.
Item.table.cellPadding: >-
  Inner padding of every text, QR and image cell, in points. Defaults to 4. A
  container cell is inset by its own `cell.box.padding` instead. Negative
  clamps with `invalid_cell_padding`.
Item.table.mergeEmptyCells: >-
  Whether a run of empty text cells in a body row merges into the next
  non-empty cell to its right, so a section-heading row reads as one wide cell
  with correct rules. Trailing empties extend the last non-empty cell, and an
  all-empty row becomes one full-width cell. Defaults to false. Swallowed cells
  lose their column-`id` placement, and QR, image and `cell:` columns never
  merge.
Item.table.style: >-
  The table's own style layer. `borderWidth` is the grid stroke — 0.5 pt by
  default, and 0 removes the grid — while the per-side map form draws an OUTER
  FRAME around each page fragment instead, leaving the inner grid at its
  default. Inherited properties cascade into every cell. `borderRadius` is
  refused with `border_radius_ignored`: a ruled grid cannot meet a curve.
Item.table.styleNames: >-
  Named `styles:` entries layered under this table's inline style, in listed
  order.
Column: >-
  One table column: its header label, how its cells get their content, and its
  width and styling. A column takes exactly one of `data` and `cell` —
  authoring both warns `column_content_conflict` and the cell wins, authoring
  neither warns `column_content_missing`.
Column.label: >-
  The header cell's text. Interpolates `{key}` like static text, but against
  TOP-LEVEL params rather than the row, because header chrome belongs to the
  document rather than to any row — so one template can print its headings in
  whichever language the params carry. A label with no braces resolves to
  itself.
Column.data: >-
  A binding read RELATIVE TO THE ROW element. `scope: document` reads top-level
  params instead, which lets a column show one document-wide value. Exclusive
  with `cell`.
Column.type: >-
  How the bound value renders. Defaults to `text`. Meaningful only beside
  `data`; on a `cell:` column it is a `column_content_conflict`.
Column.fit: >-
  Object-fit for a `type: image` column, with the same meanings as the `image`
  item. Defaults to `contain`; `cover` and `none` overflow is clipped. On any
  other column it warns `ignored_column_key`.
Column.cell: >-
  A per-row sub-template drawn instead of a bound value: any items a container
  may hold, laid out with the CELL's own top-left as the coordinate origin.
  Bindings inside it are row-scoped, exactly like the column's own. Exclusive
  with `data`, `type` and `fit`.
Column.width: >-
  The column's width. `%` resolves against the flow region width, and physical
  units work. Omitted means an equal share of whatever is left after the sized
  columns, so all-omitted is an even split. Negative becomes 0 with
  `invalid_column_width`; sized columns exceeding the flow width warn
  `table_too_wide`.
Column.style: >-
  This column's style layer, reaching its body cells and its own header label.
  `backgroundColor` and borders decorate the full cell; `textOverflow` becomes
  meaningful once the rows have a fixed height.
Column.styleNames: >-
  Named `styles:` entries layered under this column's inline style, in listed
  order.
Column.id: >-
  A stable name for this column, giving one box-index placement per cell — the
  header cell included — inset by the cell padding.
ColumnType: >-
  How a bound column value renders. `text` draws it as text; `qr_code` encodes
  it at layout time; `image` loads it as a per-row asset. QR and image cells
  scale to the row height rather than driving it, so pair them with a fixed
  row height or let the text cells set it.
EmptyBehavior: >-
  What a table does when its bound array is empty. `collapse` hides the table
  entirely; `reserve` renders the header row only.
HeaderGroup: >-
  One cell of the spanning row above the column labels.
HeaderGroup.label: >-
  The group cell's text, interpolating `{key}` against top-level params exactly
  as a column label does.
HeaderGroup.span: >-
  Required. How many columns this group covers. Cumulative span past the column count is
  clamped with `header_group_span_clamped`.
HeaderGroup.style: >-
  This group's own style layer. Its text properties and its own
  `backgroundColor` and border paint over the group row's band, so each group
  can be tinted independently; a group that authors neither keeps the band's
  default fill.
HeaderGroup.styleNames: >-
  Named `styles:` entries layered under this group's inline style, in listed
  order.
TableHeaderSpec: >-
  The header row's height and styling. It is chrome rather than a bound
  element, so `row.conditionalStyles` never reaches it.
TableHeaderSpec.height: >-
  A fixed height for the header row.
TableHeaderSpec.style: >-
  The header row's style layer. Its `backgroundColor` replaces the default
  header fill.
TableHeaderSpec.styleNames: >-
  Named `styles:` entries layered under the header's inline style, in listed
  order.
TableHeaderSpec.visuallyHidden: >-
  Whether the header row paints nothing — no label glyphs, no band fill, no
  grid ruling — while the labels stay in the PDF's text layer, so an extractor,
  a search index or an AI can still tell what each column means. Defaults to
  false. The row KEEPS its height, and a `headerGroups` row is hidden with it.
  Not a structure tree: no tagged PDF is emitted, so a screen reader gets the
  labels as flowing text with no header-to-column association. The table's own
  outer frame is not the row's and still draws across the strip.
RowSpec: >-
  The body rows' height, styling and data-driven layers.
RowSpec.minHeight: >-
  The height an auto row grows from. Defaults to 24 pt.
RowSpec.height: >-
  A fixed height for every body row, which is what activates the column-level
  `textOverflow` policies. `%` resolves against the region height; negative
  falls back to auto with `invalid_row_height`.
RowSpec.style: >-
  The base style layer for body rows. Inherited properties cascade into the
  cells; non-inherited ones decorate the row band.
RowSpec.styleNames: >-
  Named `styles:` entries layered under the base row style, in listed order.
RowSpec.alternateStyle: >-
  A style layer overlaid on EVEN rows — the second, fourth and so on — which is
  the `nth-child(even)` analogue for zebra striping.
RowSpec.alternateStyleNames: >-
  Named `styles:` entries layered under `alternateStyle`, in listed order.
RowSpec.conditionalStyles: >-
  Data-driven layers applied in listed order AFTER the base and zebra layers,
  so a later entry wins over an earlier one and any of them wins over the zebra
  layer. At most 16 entries per table (`too_many_row_conditions`); every body
  row evaluates every entry.
RowConditionalStyle: >-
  One data-driven row layer: a predicate over the row's own data, and the style
  to apply where it matches.
RowConditionalStyle.when: >-
  Required. The predicate, read relative to the row element exactly like a column's
  binding. `equals` matches a scalar type-strictly, or an array value by
  contains; with no `equals` the value is read as a boolean and the entry
  applies when it is true. A missing key is SILENT, so a blank-form params set
  simply matches nothing.
RowConditionalStyle.style: >-
  The style this layer applies. Inherited properties cascade into the row's
  cells; non-inherited ones decorate the row band. A column's own style still
  wins for its own cell.
RowConditionalStyle.styleNames: >-
  Named `styles:` entries this layer applies, in listed order.

## template.md — the file's own shape

Template: >-
  One document's template file: page geometry, the optional named-style and
  format registries, the presentation defaults, and the sections whose items
  produce content. Every wire struct rejects unknown keys, so a typo is a
  located parse error rather than a silent "unset", and non-finite numbers are
  refused anywhere in the document.
Template.version: >-
  An author-owned version marker. The engine records it and interprets nothing;
  a number or a string both parse and round-trip in the form they were written.
Template.name: >-
  The template's own name. Informational — the engine never renders it.
Template.document: >-
  Metadata written into the PDF's `/Info` dictionary and XMP. PDF only: PNG
  previews carry no metadata.
Template.page: >-
  Page size, orientation and margin. Omitted means A4 portrait with a 25 pt
  margin.
Template.styles: >-
  The named-style registry items reference through `styleNames`, the CSS-class
  analogue. At most 256 entries (`too_many_styles`); styles are flat, so one
  cannot reference another.
Template.formats: >-
  The named format registry a binding's `format:` may reference — date and
  datetime patterns given a name once and reused. At most 256 entries.
Template.defaults: >-
  The document's presentation defaults: the style cascade root, which the `rem`
  unit also follows, and the per-type format defaults.
Template.sections: >-
  The document's content. Required.
Version: >-
  An author-owned version marker: a number or a string, kept in the form it was
  written so the file round-trips. The engine does not interpret it.
Sections: >-
  The three places content can live. Only `body` is required.
Sections.header: >-
  An optional band of absolutely positioned items drawn at the top of the pages
  its `repeat` selects. Coordinates resolve against the page margin box.
Sections.body: >-
  The document's main content, either a paginating `flow` or a single-page
  `absolute` placement. Required — there is exactly one body.
Sections.footer: >-
  An optional band of absolutely positioned items drawn at the bottom of the
  pages its `repeat` selects. Same shape as the header.
Band: >-
  A header or footer band: absolutely positioned items repeated on the pages
  `repeat` selects. Coordinates resolve against the page margin box, so a band
  item's `y` is measured from the margin, not from the band. `page_number`
  items are valid only here.
Band.repeat: >-
  Which pages this band is drawn on. Defaults to `every_page`.
Band.height: >-
  The band's nominal height. Informational: items place at their own absolute
  coordinates and are not clipped to it.
Band.items: >-
  The band's items, each placed at its own coordinates.
Repeat: >-
  Which pages a band is drawn on. `every_page` draws it throughout;
  `first_page` and `last_page` draw it once at the respective end; and
  `except_first_page` draws it everywhere but the opening page, which is the
  cover-page convention.
Body: >-
  The document's main content, in one of two placement modes. `flow` stacks
  items top-down and paginates; `absolute` places them at their authored
  coordinates on page one only.
Body.flow: >-
  A stacking body: items lay out top-down with `gap` between them and paginate
  across as many pages as they need.
Body.flow.box: >-
  The flow region, resolved against the page margin box. Omitted means the
  whole margin box.
Body.flow.gap: >-
  The vertical space in points between stacked items.
Body.flow.items: >-
  The items to stack, in document order.
Body.absolute: >-
  A single-page body: items place at their authored coordinates with no
  pagination, and the margin box is their parent box.
Body.absolute.items: >-
  The items to place, each at its own coordinates.
BoxSpec: >-
  A fully specified rectangle — every side given, nothing inferred. The flow
  region uses it, where an omitted region means the whole margin box rather
  than a partly filled one.
BoxSpec.x: >-
  Offset from the parent box's left edge. Required — a `BoxSpec` states every side.
BoxSpec.y: >-
  Offset from the parent box's top edge. Required — a `BoxSpec` states every side.
BoxSpec.w: >-
  The rectangle's width; `%` resolves against the parent width. Required — a `BoxSpec` states every side.
BoxSpec.h: >-
  The rectangle's height; `%` resolves against the parent height. Required — a `BoxSpec` states every side.
Item: >-
  One entry in an `items:` array, selected by its `type:` discriminator. Almost
  every item shares `id`, `box`, `style`, `styleNames` and `link`; the
  exceptions are `line`, which carries `from`/`to` points and its own style
  shape, and `page_break`, which takes only an id.

## box.md — the border box every item is placed by; flex.md / grid.md — the child placement modes

OptBox: >-
  The geometry map every boxed item carries: position, size, margin, padding,
  min/max bounds, and — on a box with children — the layout mode and its keys.
  Every key is optional, and an unset key is omitted when the template is
  written back rather than injected as a default.
OptBox.x: >-
  Offset from the parent box's left edge; defaults to 0. In a flow it offsets
  within the flow region. Authoring it on a container child opts that child out
  of flex placement, which is the absolute escape hatch.
OptBox.y: >-
  Offset from the parent box's top edge; defaults to 0. In a flow it is IGNORED
  — the cursor owns the vertical position. Authoring it on a container child
  opts that child out of flex placement.
OptBox.w: >-
  The border-box width; `%` resolves against the parent width. Omitted means
  fill the parent width minus the horizontal margins.
OptBox.h: >-
  The border-box height; `%` resolves against the parent height. Omitted means
  AUTO height — the box grows to its content, which is the lowest child bottom
  for a container and the wrapped text height for text. A definite height is
  what activates the `textOverflow` policies on text.
OptBox.minWidth: >-
  A lower bound on the border-box width, resolving `%` against the parent
  width. Bounds clamp in CSS order — min wins over max wins over the size — so
  a minimum of 200 beside a maximum of 100 resolves to 200.
OptBox.maxWidth: >-
  An upper bound on the border-box width, resolving `%` against the parent
  width. Loses to `minWidth` where the two conflict, as in CSS.
OptBox.minHeight: >-
  A lower bound on the border-box height. Taller than the content, it reserves
  the extra space for `verticalAlign` to distribute — and a flow text carries
  that reservation across a page split, leading the first fragment and trailing
  the last. A `%` bound against an auto-height parent drops with
  `percent_of_auto`.
OptBox.maxHeight: >-
  An upper bound on the border-box height. Shorter than the content it behaves
  like a too-short explicit height: the content overflows visually and does not
  warn, because the author set the bound.
OptBox.margin: >-
  Outer spacing: a bare number for all four sides, or a per-side map whose
  UNSET SIDES ARE 0 rather than inherited. `%` resolves against the parent's
  WIDTH on all four sides, the CSS margin rule, so vertical edges stay definite
  inside auto-height containers. Flow siblings space additively with `gap` —
  there is no margin collapse. Negative values are allowed; a side may also be
  `auto`, which absorbs free space under flex placement and horizontally in a
  flow, and resolves to 0 elsewhere. Positional shorthand strings are rejected
  with a pointer to the map form, and the bare string `auto` likewise.
OptBox.padding: >-
  Inner spacing, in the same forms as `margin` but without `auto` and without
  negative values. Insets the content WITHOUT growing the box, as border-box
  sizing implies: it narrows a text item's wrap width, a container's child
  basis, an image's fit box and a `repeat` cell. An auto height grows by the
  vertical padding; an explicit one does not, and content past the content box
  then warns. `rect` has no content and ignores it.
OptBox.type: >-
  The layout mode for this box's children. Unset behaves like `flex`; `grid` is
  explicit-only, which is why grid keys never imply the mode on their own. Only
  meaningful on a box with children — on a leaf it warns `layout_key_on_leaf`.
OptBox.direction: >-
  Under flex, the main axis: `column` stacks children and `row` sets them side
  by side. Under grid, the fill order, the CSS `grid-auto-flow` analogue.
  Defaults to `column` under flex and `row` under grid.
OptBox.gap: >-
  The main-axis space between flex children, and the both-axes shorthand under
  grid, where the per-axis keys win. `%` resolves against the main-axis content
  size; negative becomes 0. Defaults to 0. Absolutely placed children ignore
  it.
OptBox.alignItems: >-
  Mirrors CSS `align-items`: cross-axis alignment of the children. `stretch`,
  the default, fills an unset cross size. A cross-axis `auto` margin opts a
  child out, since an auto margin beats alignment everywhere else here too.
OptBox.justifyContent: >-
  Mirrors CSS `justify-content`: how leftover main-axis space is distributed,
  which needs a definite main size — an auto-height column has none, so it is
  inert there. Under grid it distributes leftover width across tracks, which is
  meaningful only for a track list. Defaults to `start`. Negative free space
  degrades the CSS way.
OptBox.columns: >-
  The grid's column tracks: a COUNT, which splits the content width equally
  after the gaps, or a track LIST mixing lengths, `fr` weights and `auto`,
  where an `auto` track is sized to the widest cell placed in it. Defaults to
  one column. Without `box.type: grid` it warns `grid_key_ignored`.
OptBox.rows: >-
  The grid's row tracks, in the same forms as `columns`. Defaults to auto rows
  sized by their tallest child. A count needs a definite container height, and
  an auto-height container degrades to auto rows with a diagnostic; an `fr` row
  likewise degrades with `grid_fr_no_basis`. Rows past an explicit list are
  implicit and auto.
OptBox.columnGap: >-
  The space between grid column tracks, winning over the `gap` shorthand.
  Defaults to 0; negative becomes 0.
OptBox.rowGap: >-
  The space between grid row tracks, winning over the `gap` shorthand. Defaults
  to 0; negative becomes 0.
OptBox.flexGrow: >-
  Mirrors CSS `flex-grow`: this child's share of the LEFTOVER main-axis size,
  among the children with no authored size on that axis. Defaults to 0 — the
  CSS default, where nothing grows unless asked. A child key, so it is valid on
  a leaf; inert on a child with an authored main-axis size and under grid,
  where cells are track-sized. Works on both axes, each on its own main axis.
OptBox.flexBasis: >-
  Mirrors CSS `flex-basis`, narrowed to two spellings. The main size this child
  STARTS FROM before `flexGrow` shares out the rest. `content`, the default, is
  its max-content width — the width at which its text would not wrap; `0`
  starts it at nothing so `flexGrow` divides the whole row, which is CSS's
  `flex: 1`. A length basis is deliberately not accepted, because `w` already
  sizes a child. A row key: a column child's basis is its content height, which
  the engine measures rather than letting you name.
OptBox.columnSpan: >-
  How many grid column tracks this child spans; the cell run is the spanned
  widths plus the gaps between them. Defaults to 1 and clamps to the track
  count with `grid_span_clamped`. Outside a `type: grid` parent it warns
  `span_outside_grid` and is inert.
OptBox.rowSpan: >-
  How many grid row tracks this child spans, reserving the cells beneath.
  Defaults to 1 and clamps to 64 with `grid_span_clamped`. Outside a
  `type: grid` parent it warns `span_outside_grid` and is inert.
BoxType: >-
  A box's layout mode for its children. `flex` is the default behaviour and
  need not be written; `grid` must be, because grid keys never imply the mode
  on their own.
EdgeSpec: >-
  Outer or inner spacing: one number for all four sides, or a map naming the
  sides individually. The map specifies ALL FOUR — an unset side is 0, not some
  inherited default. Only authored keys are written back.
EdgeMapRepr: >-
  The per-side form of spacing. Each side is independent, and an unset one is
  0.
EdgeMapRepr.top: >-
  The top side's spacing. `%` resolves against the parent's WIDTH, as the CSS
  margin and padding rule says, so a vertical edge stays definite inside an
  auto-height container.
EdgeMapRepr.right: >-
  The right side's spacing. `%` resolves against the parent's width.
EdgeMapRepr.bottom: >-
  The bottom side's spacing. `%` resolves against the parent's WIDTH, not its
  height.
EdgeMapRepr.left: >-
  The left side's spacing. `%` resolves against the parent's width.
EdgeValue: >-
  One side's spacing: a length, or `auto` on a margin. An auto margin absorbs
  the free space under flex placement and horizontally in a flow — left and
  right both auto centres the box, one auto pushes it to the opposite side —
  and resolves to 0 anywhere else. Padding takes no `auto` and no negative
  value.
FlexDirection: >-
  The main axis of a flex container. `column` stacks children downward;
  `row` sets them side by side.
GridDirection: >-
  The order grid cells are filled in, the CSS `grid-auto-flow` analogue.
  `row` fills row-major; `column` fills column-major.
AlignItems: >-
  Mirrors CSS `align-items`. `stretch` fills an unset cross size — a child with
  no width fills a column's width, and a child with no height is resized to a
  row's cross size. `start`, `center` and `end` place the child within the
  cross size instead. `baseline` aligns row children on their first text
  baseline, synthesizing one from the bottom edge for a child with no text, so
  a checkbox sits exactly on its label's baseline; in a column it behaves like
  `start`, the CSS fallback. A cross-axis auto margin wins over any of them.
JustifyContent: >-
  Mirrors CSS `justify-content` for distributing free main-axis space. `start`,
  `center` and `end` pack the children at one position;
  `space_between` puts the gaps between them only, `space_around` gives each
  child equal space on both sides, and `space_evenly` makes every gap equal
  including the ends. Under negative free space the `space_` values degrade to
  `start`, as CSS does.
FlexBasis: >-
  The main size a flex child starts from before `flexGrow` shares out the rest.
  `content` is its max-content width; the literal `0` starts it at nothing so
  `flexGrow` divides the whole row. Those two spellings are the whole set — a
  length is deliberately refused, because `w` already sizes a child.

## text.md — the text item, spans, ruby and the anchored mark

Item.text: >-
  Static, interpolated or bound text drawn as one wrapped block. Content comes
  from exactly one of `text`, `data` and `spans`; none of them warns
  `empty_text_item`. Where both `text` and `data` are set, `data` wins
  silently, and a non-empty `spans` wins over both with
  `span_content_conflict`.
Item.text.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.text.box: >-
  The item's geometry. An omitted height is auto and grows with the wrapped
  text; an omitted width fills the parent.
Item.text.style: >-
  This item's inline appearance properties, the top layer of the cascade.
Item.text.styleNames: >-
  Named `styles:` entries layered under this item's inline style, in listed
  order. At most 16 per item.
Item.text.visible: >-
  Whether this item is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.text.link: >-
  A hyperlink, written into the PDF as a link annotation over the item's box.
Item.text.text: >-
  Static content with `{key}` and `{key:format}` interpolation; `{{` escapes a
  literal brace. The bare `{key}` grammar admits `[A-Za-z0-9_.]` only — a key
  outside it needs a `bindings:` declaration.
Item.text.data: >-
  A single bound params value, drawn as the item's whole content and formatted
  by the field's own rules.
Item.text.bindings: >-
  Named declarations for this item's `{name}` interpolations, carrying the
  options the bare `{key}` grammar cannot — a format, a placeholder, a document
  scope, or a key outside `[A-Za-z0-9_.]`.
Item.text.spans: >-
  Inline rich text: styled fragments concatenated in order with no separator
  and drawn as ONE wrapped block, so a Latin word crossing a fragment boundary
  still wraps as one word and kinsoku moves characters across the edges. At
  most 256 spans (`too_many_spans`); the rest are dropped.
Item.text.ruby: >-
  Readings drawn above the base runs in horizontal writing, and beside them in
  vertical. Entries apply in listed order and non-overlapping against the DRAWN
  text; an unmatched base warns `ruby_base_not_found` and the later entries
  still apply. The line box never grows — this is a fixed-leading model — so
  give the line enough `lineHeight` for the band.
Item.text.rubySize: >-
  The reading font size. Unset means half the item's font size. A reading
  longer than its base shrinks linearly to the run's width, with a 4 pt
  readability floor past which `ruby_overflow` warns.
Item.text.mark: >-
  An oval overlaid on the item's glyph band, auto-centred and auto-sized to it
  — the "circle the chosen option" mark, with no hand-measured coordinates, so
  a font change never invalidates the fit. Paint-only: it never changes the
  text's reserved box, so a blank-versus-filled params pair cannot shift the
  layout. A multi-line label gets one oval spanning all its lines.
Span: >-
  One fragment of inline rich text. Content follows the same rule as the item —
  `text` or `data` — and its style layers on top of the block's computed style.
  Only the text-run properties apply: font size, family, weight and style,
  letter spacing, colour and decoration. Anything else warns
  `ignored_span_style` and does nothing, because alignment, overflow, box
  decoration and line height stay block-level.
Span.text: >-
  Static content for this fragment, interpolating `{key}` like the item's own
  text.
Span.data: >-
  A single bound params value for this fragment.
Span.style: >-
  This fragment's inline style, layered on the block's computed style. Only
  text-run properties act; the rest warn `ignored_span_style`.
Span.styleNames: >-
  Named `styles:` entries layered under this fragment's inline style, in listed
  order.
Span.link: >-
  A hyperlink over this fragment alone, written into the PDF as a link
  annotation.
RubyPair: >-
  One reading and the run it sits over. Both are matched verbatim against the
  DRAWN text rather than against the authored source, so an interpolated value
  can carry the base.
RubyPair.base: >-
  Required. The run of drawn text this reading belongs to, matched verbatim and in listed
  order. No match warns `ruby_base_not_found`.
RubyPair.text: >-
  Required. The reading drawn over the base run, centred on its shaped extent and split
  proportionally when the base wraps across lines.
TextMark: >-
  The oval overlaid on a text item's glyph band. Its presence may be
  params-driven while its geometry stays derived from the glyphs, so an
  unmatched mark changes nothing about the layout.
TextMark.data: >-
  The presence binding. Absent means always draw, which is the pure-decoration
  case; with `equals` or as a boolean it draws only on a match.
TextMark.padding: >-
  The clearance between the glyph band and the oval. Unset applies an
  em-proportional default with a perceptual OVERSHOOT baked in, since a round
  shape flush with the caps reads smaller than it is. A negative value clamps
  so the oval stays positive.
TextMark.style: >-
  The oval's decoration subset — border width and colour, background colour and
  opacity — with a 1 pt outline default when no layer authors a width.
TextMark.styleNames: >-
  Named `styles:` entries layered under the mark's inline style, in listed
  order.

## char_grid.md — one character per cell

Item.char_grid: >-
  One character per cell in a fixed grid: manuscript paper, kanji practice
  sheets and application-form entry boxes. The engine assigns the cells,
  including the school kinsoku hang-back, so the bound string stays verbatim in
  params. In a flow body, content past one sheet continues on FULL sheets on
  the following pages; everywhere else the item draws exactly one sheet and the
  overflow is dropped with `char_grid_overflow`.
Item.char_grid.id: >-
  A stable name for this item, landing in the box index once per sheet page.
Item.char_grid.box: >-
  The item's geometry. The width defaults to the full parent width, and the
  grid is drawn from the content box's top-left.
Item.char_grid.style: >-
  This item's inline appearance properties. Authored `fontSize` sets the
  character size and unset means 0.7 of the cell — inherited sizes are
  deliberately ignored, because cells are cell-relative. `borderWidth` is the
  GRID LINE width, 0.5 pt by default, and 0 turns the ruling off;
  `backgroundColor` fills the grid area and `color` paints the characters.
Item.char_grid.styleNames: >-
  Named `styles:` entries layered under this item's inline style, in listed
  order.
Item.char_grid.visible: >-
  Whether this item is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.char_grid.text: >-
  Static content with `{key}` interpolation. `\n` starts a new line and `\r` is
  ignored; an EMPTY STRING draws a blank sheet, which is how printable
  manuscript paper is authored. Neither this nor `data` warns
  `empty_char_grid_item`.
Item.char_grid.data: >-
  One bound value as the grid's content. Inside a repeat cell it binds
  element-scoped, so a card list can carry one grid per array element.
Item.char_grid.bindings: >-
  Named declarations for this item's `{name}` interpolations, carrying the
  options the bare `{key}` grammar cannot.
Item.char_grid.grid: >-
  The cell geometry: how many cells per line, how many lines, and the sizes and
  gaps between them. Required.
Item.char_grid.writingMode: >-
  Whether lines run left-to-right down the sheet or top-to-bottom with columns
  right-to-left.
Item.char_grid.kinsoku: >-
  Which line-breaking rule set assigns the cells.
Item.char_grid.markup: >-
  Opt-in content markup. Unset, EVERY character renders verbatim — including
  the notation's own delimiters — because bound user data is never interpreted
  by default.
Item.char_grid.rubySize: >-
  The reading font size; unset means 0.4 of the cell. A reading longer than its
  base shrinks to fit with a 4 pt floor, past which `ruby_overflow` warns.
CharGridSpec: >-
  A character grid's cell geometry. Cells are square, and the product of cells
  per line and lines is clamped to 4096 with `char_grid_clamped`.
CharGridSpec.charsPerLine: >-
  Cells per line. Required, and at least 1.
CharGridSpec.lines: >-
  Lines per sheet. Required, and at least 1.
CharGridSpec.cellSize: >-
  The cell's side length. Omitted, it is derived from the content width divided
  by the cells per line — or by the lines, on a vertical grid — with the gaps
  subtracted. Non-positive warns `invalid_cell_size` and skips the item.
CharGridSpec.lineGap: >-
  Space between lines, which is the ruby band. Defaults to 0. Ruby for the
  FIRST line draws outside the grid, so reserve room with box padding or
  leftover box width.
CharGridSpec.charGap: >-
  Space between cells along a line, which is what separates workbook-style
  boxes. Defaults to 0.
KinsokuMode: >-
  Which line-breaking rule set assigns a character grid's cells. `school` is
  the rule set used on genkoyoshi, where closing punctuation never starts a
  line and shares the previous line's last cell instead; `none` assigns cells
  strictly in order.
Markup: >-
  Opt-in content markup for a character grid. `aozora` reads Aozora Bunko
  notation — ruby readings, the sheet break, the large-writing span notes and
  the line-placement notes. Leaving the key unset is the only other choice, and
  renders every character verbatim.

## defaults.md — document presentation defaults and the format registry

TemplateDefaults: >-
  Document-wide presentation defaults, the CSS `:root` analogue. A placement
  binds its key; how a date or an amount LOOKS is decided once here, so
  changing a default changes every placement that did not override it. Every
  key is omitted when unset, so an untouched template writes back without this
  block.
TemplateDefaults.locale: >-
  The document's locale id, as a BCP 47 tag. It selects the locale pack, which
  drives dates, currency display, grouping separators and units. On the CLI it
  is the fallback when `--lang` is absent.
TemplateDefaults.currency: >-
  The document's currency CODE, as ISO 4217. The middle of the currency
  fallback chain — a field's own `currency:`, then this, then the pack's
  default, then `JPY` — which is what lets a currency binding stay a bare key
  with no per-field code.
TemplateDefaults.style: >-
  The cascade ROOT style. Inherited properties flow from here into every item,
  and the `rem` unit resolves against this style's computed font size, falling
  back to the engine's 10 pt when unset.
TemplateDefaults.formats: >-
  Per-type format defaults, one per engine field type. Unknown type keys are
  parse errors.
FormatDefaults: >-
  The default display form for each engine field type. Each entry is a variant
  NAME or an inline pattern map. Inline patterns apply to dates and datetimes
  only; on another type validate warns `format_pattern_ignored` and the plain
  form renders.
FormatDefaults.date: >-
  The default display form for date fields.
FormatDefaults.datetime: >-
  The default display form for datetime fields.
FormatDefaults.number: >-
  The default display form for plain number fields.
FormatDefaults.currency: >-
  The default display form for currency fields, which is where the symbol,
  code and name spellings are chosen once for the whole document.
FormatDefaults.percentage: >-
  The default display form for percentage fields. The bound value is the
  FRACTION and the formatter scales it, so 0.1 renders as 10%.
FormatDefaults.quantity: >-
  The default display form for quantity fields, whose unit words come from the
  locale pack rather than from the template.
FormatRef: >-
  A format choice: a variant NAME the locale pack or the `formats:` registry
  declares, or an inline pattern map written in place. The name form stays a
  bare string when the template is written back and the map form stays a map.
InlineFormat: >-
  A format pattern written in place rather than named. Applies to dates and
  datetimes only.
InlineFormat.pattern: >-
  Required. The pattern itself, in the engine's date pattern grammar.
NamedFormat: >-
  One entry in the template's `formats:` registry — a pattern given a name so
  placements can reference it, the format parallel of a named style. The
  registry is capped at 256 entries (`too_many_formats`), and a field-type name
  is reserved (`reserved_format_name`).
NamedFormat.type: >-
  Required. Which field type this entry formats.
NamedFormat.pattern: >-
  Required. The pattern itself, in the engine's date pattern grammar.
NamedFormatKind: >-
  The field types a `formats:` registry entry may declare. `date` and
  `datetime` are the whole set in this version — a registry entry is a date
  pattern given a name, and the other field types have no pattern grammar to
  name.

## line.md — the stroked segment

Item.line: >-
  A straight stroked segment between two points. A line has NO box: both
  endpoints resolve against the same parent origin as its sibling items, with
  `x` measured against that box's width and `y` against its height. That is
  what makes an underline under a flex child expressible — the child's real
  width is decided at layout time, so no point value could be written down
  while authoring, but `to: { x: "100%" }` reaches its edge.
Item.line.id: >-
  A stable name for this line, adding a lookup alias beside its path in the
  `inspect` box index, and the name another item's anchor can target.
Item.line.visible: >-
  Whether this line is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.line.from: >-
  Required. The segment's first endpoint: a coordinate pair, or an anchor naming another
  item.
Item.line.to: >-
  Required. The segment's second endpoint: a coordinate pair, or an anchor naming another
  item.
Item.line.style: >-
  The line's own style shape — width, colour, opacity and stroke pattern, and
  nothing else. This is the one shape that did NOT converge onto the unified
  style, because a line is a stroke primitive with no box, so there is no
  cascade and no `styleNames`. Unknown keys are parse errors: `borderWidth` on
  a line is a typo pointing at `width`, not a silent no-op.
LineStyle: >-
  A line's own style shape. Deliberately narrow — a stroke primitive has no box
  to decorate and no text to inherit — and closed, so a key borrowed from the
  unified style is a located parse error.
LineStyle.width: >-
  The stroke width in points; defaults to 1. Capped from 0 to 1000, the same
  bound border widths carry, since both reach the renderers' stroke maths
  directly. A negative, non-finite or over-cap value warns `invalid_line_width`
  and strokes at 1 pt — unlike a border, where 0 legitimately means no border,
  a line that strokes nothing draws nothing. An authored 0 passes through
  undiagnosed.
LineStyle.color: >-
  The stroke colour as an `#rrggbb` string; defaults to black.
LineStyle.opacity: >-
  Paint alpha for the stroke, from 0 to 1; defaults to 1. Out of range warns
  `invalid_opacity` and draws opaque.
LineStyle.style: >-
  The stroke pattern, sharing the border wire's keyword set. `double` draws two
  parallel lines a third of the width each, offset either side of the authored
  geometry along its normal, so a diagonal doubles correctly.
PointSpec: >-
  One endpoint of a line: either a coordinate pair resolved against the parent
  box, or an anchor naming another item's id. An endpoint is one arm or the
  other — naming both a coordinate and an item is a parse error.
AnchorEdge: >-
  Which point of an anchored target's border box the endpoint lands on — the
  `<anchor-side>` subset CSS Anchor Positioning defines. `top`, `right`,
  `bottom` and `left` name the edges and `center` the middle, which is also the
  default: CSS makes the side mandatory because its function answers a one-axis
  inset question, while a line endpoint is a point in both axes at once.
AnchorOffset: >-
  A shift applied to an anchored endpoint after the target's edge is resolved,
  in points. Either axis may be omitted.
AnchorOffset.x: >-
  Horizontal shift of the resolved anchor point, in points.
AnchorOffset.y: >-
  Vertical shift of the resolved anchor point, in points.

## container.md / repeat.md / repeat_flow.md — the children-bearing items

ContainerItem: >-
  A box that establishes an origin and a resolved size: its children position
  relative to it, resolve `%` against it, and receive its inherited style
  properties. The SAME struct serves four surfaces — a standalone `container`
  item, a `repeat` cell, a `repeat_flow` card and a table column's `cell:` —
  so its keys mean the same thing wherever it appears; what differs is the
  parent box it is placed against. Containers nest at most 32 deep.
ContainerItem.id: >-
  A stable name for this container, adding a lookup alias beside its path in
  the `inspect` box index.
ContainerItem.box: >-
  The container's geometry and the layout mode for its children. An omitted
  width defaults to the parent width minus the x offset; an omitted height is
  auto and grows to the lowest child bottom edge plus the vertical padding.
ContainerItem.style: >-
  This container's inline style. Its decoration paints the container's own
  border box, and its INHERITED properties cascade to every descendant.
ContainerItem.styleNames: >-
  Named `styles:` entries layered under this container's inline style, in
  listed order.
ContainerItem.visible: >-
  Whether this container and its children is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
ContainerItem.items: >-
  The children. One that authors neither `box.x` nor `box.y` is a flex or grid
  item; one that authors either is absolutely placed within the container.
Item.container: >-
  The standalone form of the container struct: a box that establishes an origin
  and a resolved size for its children and cascades its inherited style
  properties to them. In a flow it behaves like any other stacked item —
  `box.y` is ignored and an explicit height reserves exactly that, with taller
  content warning `container_overflow` unless the box opts into
  `overflow: hidden`. `page_number`, `repeat`, `repeat_flow` and `page_break`
  are not allowed inside one and skip with a warning; a `table` child IS
  allowed and renders as one bounded block.
Item.container.id: >-
  A stable name for this container, adding a lookup alias beside its path in
  the `inspect` box index.
Item.container.box: >-
  The container's geometry and the layout mode for its children. An omitted
  width defaults to the parent width minus the x offset; an omitted height is
  auto and grows to the lowest child bottom edge plus the vertical padding.
Item.container.style: >-
  This container's inline style. Its decoration paints the container's own
  border box, and its INHERITED properties cascade to every descendant.
Item.container.styleNames: >-
  Named `styles:` entries layered under this container's inline style, in
  listed order.
Item.container.visible: >-
  Whether this container and its children is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.container.items: >-
  The children. One that authors neither `box.x` nor `box.y` is a flex or grid
  item; one that authors either is absolutely placed within the container.
Item.repeat: >-
  Imposition, or n-up: N instances of one cell laid onto each page, one per
  element of a bound array — four gift receipts on an A4 sheet. Each cell is
  data-scoped to its element, so the cell template is authored once with no
  per-instance field renaming. Flow-body only. Cells fill the grid, and when a
  page's grid is full the next cell starts a fresh page's grid.
Item.repeat.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.repeat.visible: >-
  Whether this imposition grid is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.repeat.data: >-
  The array params key, one cell per element in order. Required.
Item.repeat.grid: >-
  The imposition grid: how many cells across and down, the fill order, and the
  gaps between them.
Item.repeat.cell: >-
  The per-element cell, a container whose parent box is the grid slot.
  Required. It FILLS the slot by default, which gives it a definite height, so
  `%` and `verticalAlign` inside it resolve against the slot; an explicit
  `cell.box` insets or resizes it within the slot.
Item.repeat.breakBefore: >-
  Where the grid starts. Defaults to `page`.
Item.repeat.cutMarks: >-
  Whether trim guides are drawn just outside the grid, at its outer edges and
  at the centre of each interior gap. Defaults to false. Ticks reach OUTWARD so
  no ink lands on a cell, extend into the page margin and are clamped to the
  sheet; a side with no room outside the grid draws nothing there and warns
  `cut_marks_clipped`. Every page the grid occupies is marked, and the FULL
  grid is marked even on a partly filled last page, because the sheet is cut
  into the same pieces either way. The ticks are chrome — no id, and never in
  the box index.
GridSpec: >-
  An imposition grid: cells across and down, the order they fill in, and the
  gaps between them. The slot width is the region width less the column gaps
  divided by the columns, and the height likewise.
GridSpec.columns: >-
  Cells across per page; defaults to 1. Columns times rows clamps to 64 with
  `imposition_grid_clamped`.
GridSpec.rows: >-
  Cells down per page; defaults to 1.
GridSpec.direction: >-
  The order cells fill in. Defaults to `row`.
GridSpec.gap: >-
  Both axes at once, the CSS shorthand. Defaults to 0; a per-axis key wins over
  it.
GridSpec.columnGap: >-
  The gap between columns, resolving `%` against the region width. Defaults to
  the `gap` shorthand; negative is 0, as in CSS.
GridSpec.rowGap: >-
  The gap between rows, resolving `%` against the region height. Defaults to
  the `gap` shorthand; negative is 0, as in CSS.
BreakBefore: >-
  Where an imposition grid starts. `page` aligns it to a fresh page, which is
  the default; `auto` starts it at the flow cursor, so a title above the grid
  costs rows rather than a whole page.
Item.repeat_flow: >-
  One auto-height card per element of a bound array, in normal flow — a
  vertical card list. Where `repeat` is the rigid n-up sheet, this is its
  flowing counterpart: cards start at the cursor, stack with `gap`, and
  paginate one card at a time. Flow-body only. A card is an ATOM, so one that
  does not fit moves whole to the next page and keep-together is inherent —
  there is no key for it. A card taller than the region warns
  `section_overflow`.
Item.repeat_flow.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.repeat_flow.visible: >-
  Whether this card list is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.repeat_flow.data: >-
  The array params key, one card per element in order. Required.
Item.repeat_flow.gap: >-
  The space between cards, resolving `%` against the region height. Defaults to
  0; negative clamps to 0 and out-of-range drops with `length_out_of_range`.
Item.repeat_flow.item: >-
  The per-element card, a container. Required. Auto height by default, with
  horizontal auto margins working, its style cascading to its children and its
  decoration painting once per instance.

## the remaining item types and the shared concept shapes

Item.image: >-
  A raster or SVG image. The source is a template-time `src` or a
  params-bound `data`, and exactly one should be set. Width and height are
  REQUIRED — layout never sizes from the image's own pixels — and an image
  never paints outside its content box.
Item.image.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.image.box: >-
  The item's geometry. The fit box is the content box, inset by the padding.
  The KEY is optional on the wire, but a width and height are not optional at
  layout: without them the item warns `image_missing_size` and is skipped,
  because layout never sizes from the image's own pixels.
Item.image.style: >-
  This item's inline style. Decoration and opacity act; the text properties are
  unused.
Item.image.styleNames: >-
  Named `styles:` entries layered under this item's inline style, in listed
  order.
Item.image.visible: >-
  Whether this image is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.image.link: >-
  A hyperlink over the drawn box, written into the PDF as a link annotation.
Item.image.src: >-
  A template-time source: a bundled path, a `data:` URI, or inline SVG markup.
  A path resolves against the ASSETS ROOT, which defaults to the template
  file's own directory; a path escaping the root is rejected with
  `asset_traversal`. A remote URL is recognized and rejected with
  `remote_asset_unsupported` — the render path has no network I/O, and unlike a
  font there is no hash pin that would make fetching an image deterministic.
Item.image.data: >-
  A params-bound source, gated by the host's asset policy — open or
  bundled-only, with per-item allow and deny lists.
Item.image.bindings: >-
  Named declarations for the `{name}` interpolations in this item's link URL.
Item.image.fit: >-
  Mirrors CSS `object-fit`, always centred. Defaults to `contain`. `cover` and
  `none` clip anything past the content box, and an SVG clips under every fit
  because nothing stops a path being drawn outside its own viewBox.
ImageFit: >-
  How an image is scaled into its box, mirroring CSS `object-fit`. `contain`
  preserves the aspect ratio inside the box and letterboxes; `cover` preserves
  it while filling the box and crops the overflow; `stretch` fills the box
  exactly and distorts; `none` draws at the asset's intrinsic size — raster
  pixels at 72 dpi, or SVG viewBox units.
Item.qr_code: >-
  A QR code encoded at LAYOUT TIME into vector module rectangles, so it needs
  no asset pipeline and works inside repeat cells with element-scoped bindings.
  The engine encodes whatever string it is given and reads no semantics into
  it. The encoded string is the FORMATTED value, like any text placement, so a
  field with enum display labels encodes its label — bind `format: value` to
  encode the machine value instead.
Item.qr_code.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.qr_code.box: >-
  The item's geometry. The code draws SQUARE on the smaller content-box side,
  centred, with the four-module quiet zone inside the box. The KEY is optional
  on the wire, but a width and height are not optional at layout: without them
  the item warns `qr_missing_size` and is skipped.
Item.qr_code.style: >-
  This item's inline style. Decoration only: `backgroundColor` paints under the
  modules, which is the usual white backing, plus the border keys.
Item.qr_code.styleNames: >-
  Named `styles:` entries layered under this item's inline style, in listed
  order.
Item.qr_code.visible: >-
  Whether this code is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.qr_code.text: >-
  Static content with `{key}` interpolation, exactly like a text item's.
Item.qr_code.data: >-
  One bound value as the code's content, scope-aware so it resolves per element
  inside a cell.
Item.qr_code.bindings: >-
  Named declarations for this item's `{name}` interpolations, carrying the
  options the bare `{key}` grammar cannot.
Item.qr_code.errorCorrection: >-
  How much damage the code tolerates. Defaults to `medium`. A higher level
  needs more modules for the same content, and content is capped at 1 KiB
  (`qr_content_too_long`) because params are untrusted and modules fan out into
  tree items.
EcLevel: >-
  A QR code's error-correction level, tolerating roughly 7, 15, 25 and 30
  percent damage respectively. `low`, `medium`, `quartile` and `high` are the
  ISO 18004 levels; a higher one needs more modules for the same content.
Item.list: >-
  A bounded per-element list: an array field rendered one entry per line,
  clamping at the last fitting entry and ending with an overflow line when
  entries were cut. No pagination by design — inside a repeat cell the box is a
  fixed slot, and in a flow an auto-height list simply grows. One line per
  entry, never wrapped: an entry wider than the box takes the per-entry
  ellipsis instead. At most 1000 entries, and the capped ones still count into
  the overflow line's total.
Item.list.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.list.box: >-
  The item's geometry. A DEFINITE height is what activates the clamp: the list
  cuts at the last fitting entry minus one and appends the overflow line.
Item.list.style: >-
  This item's inline style; the text properties style every line.
Item.list.styleNames: >-
  Named `styles:` entries layered under this item's inline style, in listed
  order.
Item.list.visible: >-
  Whether this list is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.list.data: >-
  The array to render: a params key, or — inside a repeat cell or a card — a
  field of the bound element. Required.
Item.list.text: >-
  A per-entry template, interpolating `{key}` against the ENTRY object. The
  keys are the fields the array's `items:` schema declares, so a typo warns
  `unknown_data_key` at validate, and each resolves through its declared field
  spec. Unset, scalar entries print directly — strings as they are and numbers
  in plain form, with no locale formatting.
Item.list.bindings: >-
  Named declarations for the `{name}` interpolations in `text`. They resolve
  per ENTRY like the template itself, unless one authors a document scope.
Item.list.overflowText: >-
  The template for the trailing overflow line, where `{count}` is the number of
  entries that did NOT fit. Defaults to `+{count}`.
Item.page_number: >-
  The current page number. BAND-ONLY: the page count is known only at
  assembly, and the bands are the per-page surface. In a body it warns
  `page_number_in_body` and in a container `page_number_in_container`, and is
  skipped either way. Pair it with the band's own `repeat` mode to choose which
  pages show it.
Item.page_number.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.page_number.box: >-
  The item's geometry. Bands share the margin-box origin with the body — there
  is no footer-local origin — so a footer number needs a `y` near the bottom of
  the margin box.
Item.page_number.style: >-
  This item's inline style, in the usual text forms.
Item.page_number.styleNames: >-
  Named `styles:` entries layered under this item's inline style, in listed
  order.
Item.page_number.visible: >-
  Whether this page number is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.page_number.format: >-
  The line's template, where `{page}` is the current one-based page and
  `{pages}` the total. Any other text passes through. Defaults to
  `{page} / {pages}`.
Item.rect: >-
  A rectangle: pure decoration painted by the unified style properties, with
  named styles like any other item. It has no content, so padding and the
  text-level style keys are ignored and inert ones warn `shape_style_ignored`.
  NOTHING DRAWS unless a style layer authors it — a bare rect is invisible,
  since there is no implicit default stroke. Width and height are required
  (`rect_missing_size`).
Item.rect.id: >-
  A stable name for this item, adding a lookup alias beside its path in the
  `inspect` box index.
Item.rect.box: >-
  The rectangle's geometry. Width and height are required; padding is ignored,
  because there is no content to inset.
Item.rect.style: >-
  This rectangle's inline style — background, border and opacity. Text-level
  keys are inert and warn `shape_style_ignored`.
Item.rect.styleNames: >-
  Named `styles:` entries layered under this rectangle's inline style, in
  listed order.
Item.rect.visible: >-
  Whether this rectangle is SHOWN. When the predicate does not hold, the
  default is that the box is still reserved and nothing is painted, so a
  blank-versus-filled params pair cannot shift the layout by a point;
  `collapse: true` removes it from layout instead. A key missing from
  params, or a value that simply does not match, hides it SILENTLY.
Item.page_break: >-
  Forces the flow to continue on a new page. It takes only an id and a
  visibility predicate — there is nothing else to author.
Item.page_break.id: >-
  A stable name for this break, adding a lookup alias beside its path in the
  `inspect` box index.
Item.page_break.visible: >-
  Whether this break happens. It generates no box either way, so the
  `collapse` choice makes no difference here.
Item.ellipse: >-
  A standalone oval mark for real forms — circling a printed choice. Its
  PRESENCE is content, driven by params, while its GEOMETRY is template-fixed:
  an unmatched mark still reserves its box, so a blank form and a filled one
  have the same layout. Unlike a rect, a mark whose layers author no border
  width keeps a 1 pt outline default, because a mark's visible outline is the
  point of it. A per-side border width warns `shape_border_sides_ignored`.
Item.ellipse.id: >-
  A stable name for this mark, adding a lookup alias beside its path in the
  `inspect` box index.
Item.ellipse.box: >-
  The mark's geometry. The KEY is optional on the wire, but an absent or
  non-positive size warns `mark_missing_size` and the mark is skipped — an
  ellipse has no intrinsic size to fall back on.
Item.ellipse.style: >-
  This mark's inline style, the decoration subset, with a 1 pt outline default
  when no layer authors a width. Inert text keys warn `shape_style_ignored`.
Item.ellipse.styleNames: >-
  Named `styles:` entries layered under this mark's inline style, in listed
  order.
Item.ellipse.visible: >-
  Whether this mark is SHOWN. Distinct from `data:`, which decides whether
  the oval DRAWS while the box is reserved either way — `visible:` decides
  whether the item participates at all, and `collapse: true` takes its box
  out of layout.
Item.ellipse.data: >-
  The presence binding. Absent means always draw, which is decoration; with
  `equals` or read as a boolean, the mark draws only on a match. An unmatched
  mark still reserves its box.
Item.ellipse.anchor: >-
  The id of another item this mark circles, so the oval follows whatever that
  item's placement turns out to be — the way to circle something you cannot
  author a text `mark:` on.
Item.checkbox: >-
  A checkbox for real forms. The FRAME is chrome and always draws; the CHECK
  MARK is content, drawn when `checked: true` is authored or when `data:`
  matches, so an empty box is the blank-form state. Its geometry is
  template-fixed, so a blank form and a filled one have the same layout.
Item.checkbox.id: >-
  A stable name for this checkbox, adding a lookup alias beside its path in the
  `inspect` box index.
Item.checkbox.box: >-
  The checkbox's geometry. The KEY is optional on the wire, and a checkbox
  AUTO-SIZES when it has none — unlike an ellipse, which warns
  `mark_missing_size` and is skipped.
Item.checkbox.style: >-
  This checkbox's inline style, the decoration subset, with a 1 pt outline
  default when no layer authors a width. Inert text keys warn
  `shape_style_ignored`.
Item.checkbox.styleNames: >-
  Named `styles:` entries layered under this checkbox's inline style, in listed
  order.
Item.checkbox.visible: >-
  Whether this checkbox is SHOWN. Distinct from `checked` and `data:`, which
  decide whether the CHECK MARK draws inside a frame that is there either
  way — `visible:` decides whether the item participates at all, and
  `collapse: true` takes its box out of layout.
Item.checkbox.checked: >-
  A static tick. Authoring both this and `data:` warns
  `mark_content_conflict` and the binding wins.
Item.checkbox.data: >-
  The presence binding for the tick. With `equals` it draws on a match; without
  one, the value is read as a boolean and it draws when true.
PageSpec: >-
  The sheet geometry for every page of the document. All three keys are
  optional, and the defaults are A4 portrait with a 25 pt margin on every side.
PageSpec.size: >-
  The paper size: a named preset, or custom dimensions. Custom sides are
  absolute lengths — `%` is rejected, since there is no parent to resolve
  against — and each is capped at 14,400 pt, the PDF page limit.
PageSpec.orientation: >-
  The sheet's orientation, which swaps the two dimensions of a NAMED size.
  Defaults to `portrait`. It is a no-op for a custom size, which already states
  its dimensions literally, so nothing is double-swapped; that combination
  warns `orientation_ignored`.
PageSpec.margin: >-
  The printable-area insets, and with them the coordinate origin: `x: 0` and
  `y: 0` mean the margin corner for the bands, both body kinds and the flow
  region. The all-sides form is a bare POINT number only — one value with a
  unit is a parse error, and units go in the per-side map, whose unset sides
  are 0 rather than 25. Sides resolve `%` against the page WIDTH on all four
  edges, the CSS rule. Margins that would consume a whole page axis fall back
  to 0 on that axis with `page_margin_too_large`, so the origin always has
  positive room. Absolute items may use NEGATIVE coordinates to reach into the
  margin, which is bleed and crop-mark territory.
PageSize: >-
  A paper size: one of eight named presets, or a custom `{ w, h }` in absolute
  units. The names are the whole set — `A3`, `A4` and `A5` from ISO A; `B4` and
  `B5` from the JAPANESE JIS B series, which is not ISO B; and `Letter`,
  `Legal` and `Tabloid`. Anything else is a parse error, so a size this list
  does not carry has to be written as dimensions. Every named size gets the
  same 25 pt default margin.
Orientation: >-
  The sheet's orientation. `portrait` is the default; `landscape` swaps the two
  dimensions of a named size and does nothing to a custom one.
PageMargin: >-
  The printable-area insets: a bare point number for all four sides, a per-side
  map whose unset sides are 0, or the legacy top-right-bottom-left array. The
  authored form round-trips. Negative sides, `auto`, wrong array lengths and
  unknown map keys are all parse errors.
DocumentMeta: >-
  What the file says it IS, as opposed to what it draws: the metadata that
  lands in the PDF's document properties, where a reader's panel shows it, a
  search index reads it and a screen reader announces the language. NOTHING
  here appears on the page, and PNG previews carry none of it. Every value
  interpolates `{key}` like static text, against top-level params. There is no
  `bindings:` map here, so an interpolation name must be inside the reference
  charset.
DocumentMeta.title: >-
  The document title. Unset, it falls back to the template's `name:` and then
  to a generic default.
DocumentMeta.description: >-
  A short summary of the document, written to the PDF's subject field.
DocumentMeta.keywords: >-
  Search keywords. At most 64 entries.
DocumentMeta.language: >-
  The document's language as a BCP 47 tag, which is what a screen reader
  announces. Unset, it falls back to `defaults.locale`.
DocumentMeta.authors: >-
  Who the document is by. At most 64 entries.
VisibleBinding: >-
  The predicate deciding whether an item is shown, available on every item. It
  is the form-mark presence binding generalized to the whole item vocabulary —
  the same keys, the same truth table, the same diagnostics about a literal
  that can never match — plus a choice about the SPACE the item leaves behind.
  A key missing from params, or one that simply does not match, hides the item
  SILENTLY, so a blank form draws nothing and says nothing.
VisibleBinding.key: >-
  The params field to read, as a dotted path. Required.
VisibleBinding.equals: >-
  The value the field must equal for the item to show. Equality is
  TYPE-STRICT, so the string `"2"` never matches the number 2, and an array
  value is a multi-select — the item shows when the array CONTAINS this value,
  which is what a checkbox group's params look like. Omitted, the value is read
  as a boolean and the item shows when it is true.
VisibleBinding.scope: >-
  Which data the key resolves against inside a repeat cell. Defaults to
  `element`, so each element decides for itself; `document` is the escape a
  page-global flag needs.
VisibleBinding.collapse: >-
  Whether a hidden item is removed from layout entirely rather than reserving
  its box. Defaults to false, the form-mark posture, where everything around
  the item stays exactly where it was so a blank-versus-filled params pair
  never shifts the layout by a point. True closes the siblings up over it and
  takes the separating gap with it.
Link: >-
  A clickable URL, emitted as a PDF link annotation over the item's drawn
  geometry. Always the object form — a bare string is a parse error — which
  reserves room for internal destinations later. PNG previews ignore links,
  having no annotation surface.
Link.url: >-
  Required. The destination, interpolating `{key}` like static text.
Length: >-
  Every geometry value. The canonical unit is the PDF point, so a bare number
  is points. A string may carry `pt`, `mm`, `cm` or `in`, all absolute and
  usable where no layout basis exists; `%` of the parent's resolved size along
  the same axis, except on margin and padding sides, which resolve against the
  parent's WIDTH on all four edges; `em`, multiples of the INHERITED font size,
  so an item's own inline size does not affect its own box lengths; or `rem`,
  multiples of the engine default size, which is a stable scale unit. `px` is
  deliberately not a template unit, and `fr` is not a length — it is a
  grid-track weight, so writing it where a length is expected is a parse error.
  A resolved length past a million points falls back to the key's default with
  `length_out_of_range`.
TrackSpec: >-
  A grid axis: a COUNT, which splits the content size equally after the gaps,
  or a LIST of tracks mixing lengths, `fr` weights and `auto`.
GridTrack: >-
  One grid track: a fixed length, an `fr` weight taking a share of what is left
  after the fixed tracks and the gaps, or `auto`, sized to the widest or
  tallest cell placed in it. Weights must be finite and non-negative.
Binding: >-
  One bound params value. The key is required; the rest choose how it is
  displayed, what stands in for a blank, and which data it resolves against.
Binding.key: >-
  The params key, as a dot-separated path. Required.
Binding.format: >-
  The display variant to render this value with. It must be declared for the
  field, be an entry in the template's `formats:` registry, be one of the
  currency variants, be `value` on a field with enum display labels, or be a
  type override; anything else warns `unknown_format`.
Binding.placeholder: >-
  Text drawn when the value is ABSENT, `null` or the empty string, instead of
  leaving the field empty and reporting it. This is the "intentionally blank"
  signal a fillable form needs, so one template renders both a blank form and a
  filled one from two params files. Drawn VERBATIM — never interpolated, and it
  bypasses the type formatter entirely. The placement's own wins over the
  field's declared one, and the empty string suppresses the diagnostic without
  drawing anything. A value that is present but unusable is a different case
  and still reports.
Binding.scope: >-
  Which data this binding resolves against. Defaults to `element` inside a
  table row, a repeat cell or a card, and to the top-level params everywhere
  else.
BindingScope: >-
  Which data a binding resolves against. `element` is the bound array element —
  a table row, a repeat cell's element, a card's element — and is the default
  inside those constructs; `document` is the escape back to top-level params,
  which is what a page-global value like a store name needs.
MarkBinding: >-
  The presence predicate a form mark, a row condition or an item's `visible:`
  is driven by. Its key is read at the ambient scope unless it escapes to the
  document, and equality is type-strict.
MarkBinding.key: >-
  The params field to read, as a dotted path. Required.
MarkBinding.equals: >-
  The value the field must equal. Type-strict, so the string `"2"` never
  matches the number 2; an ARRAY value is a multi-select and matches when it
  contains this value. Omitted, the field is read as a boolean and the
  predicate holds when it is true.
MarkBinding.scope: >-
  Which data the key resolves against inside a cell. `element` is the default;
  `document` reads top-level params, which a page-global flag needs.
EqualsValue: >-
  The literal a presence predicate compares against: a string, a number or a
  boolean. Maps and sequences are parse errors, because the comparison is
  type-strict and there is nothing sensible to compare a container to.
WritingMode: >-
  The block and inline directions of a text surface. `horizontal_tb` is the
  default — lines run left to right and stack downward. `vertical_rl` turns a
  text item into a vertical block: characters fill top to bottom and columns
  lay out right to left.
