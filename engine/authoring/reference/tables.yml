"grid#keys-on-the-container-s-box":
  page: grid
  node: OptBox
  coverage: subset
  subset: "the grid keys of a box; the flex keys are on flex.md and the geometry keys on box.md"
  columns:
    - header: "Key"
      from: authored
    - header: "Values"
      from: authored
    - header: "Default"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["type"]
      cells:
        "Key": "`type`"
        "Values": "`grid`"
        "Default": "—"
        "Description": "Required to activate grid placement."
    - keys: ["columns"]
      cells:
        "Key": "`columns`"
        "Values": "count | list of [Length](length.md)/`fr`/`auto`"
        "Default": "1 column"
        "Description": "Column tracks: a **count** (equal split of the content width minus gaps) or a **track list** (`[\"auto\", \"1fr\", \"30%\", 50]`, any Length, `fr` weight — see [`fr` weights](#fr-weights) — and/or `auto`, sized to the widest cell placed in the track)."
    - keys: ["rows"]
      cells:
        "Key": "`rows`"
        "Values": "count | list of Length/`fr`/`auto`"
        "Default": "auto rows"
        "Description": "A count needs a definite container height (auto-height degrades to auto rows with a diagnostic); rows beyond an explicit list are implicit — auto, sized by their tallest child. Writing `auto` in the list says exactly that, so `[\"auto\", \"1fr\"]` reads the way it looks. An `fr` row needs a definite height (auto-height degrades with `grid_fr_no_basis`)."
    - keys: ["columnGap", "rowGap"]
      cells:
        "Key": "`columnGap` / `rowGap`"
        "Values": "Length"
        "Default": "0"
        "Description": "Per-axis gaps; the flex `gap` doubles as the both-axes shorthand (specific keys win). Negative gaps are 0."
    - keys: ["direction"]
      cells:
        "Key": "`direction`"
        "Values": "`row` | `column`"
        "Default": "`row`"
        "Description": "Fill order (CSS `grid-auto-flow` analog): `row` = row-major."
    - keys: ["justifyContent"]
      cells:
        "Key": "`justifyContent`"
        "Values": "flex values"
        "Default": "`start`"
        "Description": "Distributes leftover width across tracks (only meaningful for track lists — counts consume the axis)."
    - keys: ["alignItems"]
      cells:
        "Key": "`alignItems`"
        "Values": "flex values"
        "Default": "`stretch`"
        "Description": "Aligns children within their row (with vertical auto margins)."

"grid#keys-on-the-container-s-box-2":
