# The generated reference tables' editorial half.
#
# Regenerate the tables themselves with `make reference:generate`;
# `make reference:check` fails when a page and this file disagree.
#
# What lives here is only what the catalog cannot answer: which of a
# node's keys a page shows, how its rows group, and what its columns
# say. Which keys EXIST, and their prose, come from the catalog — and
# `tables::audit` refuses a row naming a key the node does not have,
# or a key the node has that this file neither shows nor excuses.

"README#the-box-keys-at-a-glance":
  page: README
  node: OptBox
  coverage: full
  columns:
    - header: "Key"
      from: authored
    - header: "Meaning"
      from: authored
    - header: "Page"
      from: authored
  rows:
    - keys: ["x", "y"]
      cells:
        "Key": "`x` `y`"
        "Meaning": "offset from the parent origin (authoring either opts a container child out of flex)"
        "Page": "[box.md](box.md)"
    - keys: ["w", "h"]
      cells:
        "Key": "`w` `h`"
        "Meaning": "border-box size; omitted = fill width / auto height"
        "Page": "[box.md](box.md)"
    - keys: ["minWidth", "maxWidth", "minHeight", "maxHeight"]
      cells:
        "Key": "`minWidth` `maxWidth` `minHeight` `maxHeight`"
        "Meaning": "CSS-order size clamps"
        "Page": "[box.md](box.md)"
    - keys: ["margin"]
      cells:
        "Key": "`margin`"
        "Meaning": "outer spacing; per-side map; `auto` sides"
        "Page": "[box.md](box.md)"
    - keys: ["padding"]
      cells:
        "Key": "`padding`"
        "Meaning": "inner spacing (non-negative)"
        "Page": "[box.md](box.md)"
    - keys: ["type"]
      cells:
        "Key": "`type`"
        "Meaning": "child layout mode: `flex` (default) | `grid`"
        "Page": "[flex.md](flex.md) / [grid.md](grid.md)"
    - keys: ["direction", "gap", "alignItems", "justifyContent"]
      cells:
        "Key": "`direction` `gap` `alignItems` `justifyContent`"
        "Meaning": "flex keys (grid reuses some)"
        "Page": "[flex.md](flex.md)"
    - keys: ["flexGrow"]
      cells:
        "Key": "`flexGrow`"
        "Meaning": "child's weighted share of leftover row width"
        "Page": "[flex.md](flex.md)"
    - keys: ["columns", "rows", "columnGap", "rowGap"]
      cells:
        "Key": "`columns` `rows` `columnGap` `rowGap`"
        "Meaning": "grid tracks & gaps"
        "Page": "[grid.md](grid.md)"
    - keys: ["columnSpan", "rowSpan"]
      cells:
        "Key": "`columnSpan` `rowSpan`"
        "Meaning": "grid child's track span (≥ 1)"
        "Page": "[grid.md](grid.md)"
  omitted:
    "flexBasis": "a flex-only key; documented on flex.md"

"box#position-size":
  page: box
  node: BoxSpec
  coverage: full
  columns:
    - header: "Key"
      from: authored
    - header: "Type"
      from: authored
    - header: "Omitted means"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["x", "y"]
      cells:
        "Key": "`x`, `y`"
        "Type": "[Length](length.md)"
        "Omitted means": "0"
        "Description": "Offset from the parent box origin. In a **flow**, `y` is ignored (the cursor owns it) and `x` offsets within the flow region. Authoring `x` or `y` on a container child opts it out of flex placement (see [flex.md](flex.md))."
    - keys: ["w"]
      cells:
        "Key": "`w`"
        "Type": "Length"
        "Omitted means": "fill parent width minus horizontal margins"
        "Description": "`%` resolves against the parent width."
    - keys: ["h"]
      cells:
        "Key": "`h`"
        "Type": "Length"
        "Omitted means": "**auto height** — grows to content (lowest child bottom for containers, wrapped text height for text)"
        "Description": "`%` resolves against the parent height. A definite `h` activates `textOverflow` policies on text."

"char_grid#keys":
  page: char_grid
  node: Item.char_grid
  coverage: full
  columns:
    - header: "Key"
      from: authored
    - header: "Values"
      from: authored
    - header: "Default"
      from: authored
    - header: "Meaning"
      from: authored
  rows:
    - keys: ["text", "data"]
      cells:
        "Key": "`text` / `data`"
        "Values": "like a text item"
        "Default": "—"
        "Meaning": "Content: static text with `{key}` interpolation, or one bound value. Neither set warns `empty_char_grid_item`. An empty string draws a blank sheet (printable manuscript paper)."
    - keys: ["bindings"]
      cells:
        "Key": "`bindings`"
        "Values": "map of name → binding"
        "Default": "unset"
        "Meaning": "Named declarations for this item's `{name}` interpolations — the option set the bare `{key}` grammar cannot carry, incl. a key outside `[A-Za-z0-9_.]` ([data-binding.md](data-binding.md#named-binding-declarations))."
    - keys: ["grid"]
      cells:
        "Key": "`grid.charsPerLine`"
        "Values": "integer ≥ 1"
        "Default": "required"
        "Meaning": "Cells per line."
    - keys: ["grid"]
      cells:
        "Key": "`grid.lines`"
        "Values": "integer ≥ 1"
        "Default": "required"
        "Meaning": "Lines per sheet. `charsPerLine × lines` is clamped to 4096 cells (`char_grid_clamped`)."
    - keys: ["grid"]
      cells:
        "Key": "`grid.cellSize`"
        "Values": "[length](length.md)"
        "Default": "derived"
        "Meaning": "Cell side (cells are square). Omitted: the content width divided by `charsPerLine` (horizontal) or `lines` (vertical), gaps subtracted. Non-positive warns `invalid_cell_size` and skips the item."
    - keys: ["grid"]
      cells:
        "Key": "`grid.lineGap`"
        "Values": "length ≥ 0"
        "Default": "`0`"
        "Meaning": "Space between lines — the ruby band. Ruby for the *first* line draws above (horizontal) / right of (vertical) the grid: reserve room with `box.padding` or leftover box width."
    - keys: ["grid"]
      cells:
        "Key": "`grid.charGap`"
        "Values": "length ≥ 0"
        "Default": "`0`"
        "Meaning": "Space between cells along a line (workbook-style separated boxes)."
    - keys: ["writingMode"]
      cells:
        "Key": "`writingMode`"
        "Values": "`horizontal_tb` | `vertical_rl`"
        "Default": "`horizontal_tb`"
        "Meaning": "`vertical_rl` runs lines top-to-bottom, columns right-to-left."
    - keys: ["kinsoku"]
      cells:
        "Key": "`kinsoku`"
        "Values": "`school` | `none`"
        "Default": "`school`"
        "Meaning": "See below."
    - keys: ["markup"]
      cells:
        "Key": "`markup`"
        "Values": "`aozora`"
        "Default": "unset"
        "Meaning": "Opt-in content markup: ruby (`《》`), the `［＃改ページ］` sheet break, the large-writing span notes, and the line-placement notes — see the sections below. Unset, every character (including `《》` and `［＃…］`) renders verbatim — bound user data is never interpreted by default."
    - keys: ["rubySize"]
      cells:
        "Key": "`rubySize`"
        "Values": "length"
        "Default": "0.4 × cellSize"
        "Meaning": "Ruby font size. Each reading is centered along its base run's extent (horizontal: above it; vertical: beside it) and shrinks to fit when longer — 4pt floor, past which `ruby_overflow` warns. A 2-char reading over a 1-cell base therefore shrinks to ~half a cell per char and stays centered on that cell."
    - keys: ["box", "style", "styleNames", "id"]
      cells:
        "Key": "`box` / `style` / `styleNames` / `id`"
        "Values": "common keys"
        "Default": "—"
        "Meaning": "`box.w` defaults to the full width; the grid is drawn from the content box's top-left. `id` lands in the box index per sheet page."
  omitted:
    "type": "the discriminator — it is this page's own heading"
    "visible": "item-common; documented on visible.md"

