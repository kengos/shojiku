"flex#child-key-on-a-flex-item-s-own-box":
  page: flex
  node: OptBox
  coverage: subset
  subset: "the one flex key a child carries; the rest of a child's box is on box.md"
  columns:
    - header: "Key"
      from: authored
    - header: "Values"
      from: authored
    - header: "Default"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["flexGrow"]
      cells:
        "Key": "`flexGrow`"
        "Values": "number ≥ 0"
        "Default": "0"
        "Description": "The child's share of the **leftover** main-axis size, among children without an authored size on that axis (CSS `flex-grow`). `flexGrow: 2` next to `flexGrow: 1` takes ⅔ of what is left after every child's basis. The default is CSS's: nothing grows unless asked."
    - keys: ["flexBasis"]
      cells:
        "Key": "`flexBasis`"
        "Values": "`content` | `0`"
        "Default": "`content`"
        "Description": "The main size such a child **starts from**, before `flexGrow` shares out the rest (CSS `flex-basis`). `content` is its max-content width — the width at which its text would not wrap. `0` starts it at nothing, so `flexGrow` divides the whole row: that is CSS's `flex: 1`, and it is what this engine used to do unconditionally. A length basis is deliberately not accepted — `w` already sizes a child."

"flex#keys-on-the-container-s-box":
  page: flex
  node: OptBox
  coverage: subset
  subset: "the flex keys of a box; the grid keys are on grid.md and the geometry keys on box.md"
  columns:
    - header: "Key"
      from: authored
    - header: "Values"
      from: authored
    - header: "Default"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["direction"]
      cells:
        "Key": "`direction`"
        "Values": "`column` | `row`"
        "Default": "`column`"
        "Description": "Main axis. `column` stacks; `row` sets children side by side."
    - keys: ["gap"]
      cells:
        "Key": "`gap`"
        "Values": "[Length](length.md)"
        "Default": "0"
        "Description": "Main-axis gap between flex children (`%` of the main-axis content size; negative = 0). Absolutely placed children ignore it."
    - keys: ["alignItems"]
      cells:
        "Key": "`alignItems`"
        "Values": "`stretch` | `start` | `center` | `end` | `baseline`"
        "Default": "`stretch`"
        "Description": "Cross-axis alignment. `stretch` fills an unset cross size: a child with no `w` fills a `column`'s width, and a child with no `h` **is resized to** a `row`'s cross size — the row's own height when it has one, otherwise its tallest child's (CSS Flexbox §9.4). A cross-axis `auto` margin opts a child out, since an `auto` margin beats alignment everywhere else here too. `baseline` aligns row children on their **first text baseline** — a child with no text (a mark, rect, image, or clipped box) synthesizes its baseline from its bottom edge, so a `checkbox` bottom sits exactly on its label's baseline (the natural look for label + mark rows; `center` centers *line boxes*, which reads as skew when the font carries large below-baseline space). In a column it behaves like `start` (the CSS fallback); cross-axis auto margins win over any alignment."
    - keys: ["justifyContent"]
      cells:
        "Key": "`justifyContent`"
        "Values": "`start` | `center` | `end` | `space_between` | `space_around` | `space_evenly`"
        "Default": "`start`"
        "Description": "Main-axis distribution of free space when the container's main size is definite (an auto-height column has none, so it is inert there). Negative free space degrades the CSS way (`space_*` act like `start`)."

