"style#property-reference":
  page: style
  node: Style
  coverage: full
  columns:
    - header: "Property"
      from: authored
    - header: "Type / values"
      from: authored
    - header: "Engine default"
      from: authored
    - header: "Inherited"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["fontSize"]
      cells:
        "Property": "`fontSize`"
        "Type / values": "number (pt) or length string"
        "Engine default": "`10`"
        "Inherited": "yes"
        "Description": "Strings take `pt`/`mm`/`cm`/`in`, `em`/`%` (of the *inherited* size — nested relative sizes multiply), or `rem` (of the engine default). Non-positive/non-finite computed values fall back with `invalid_font_size`; computed sizes over 1000 pt fall back with `font_size_out_of_range` (the cap pairs with `lineHeight`'s so the tallest admitted line box is the ±1,000,000 pt resolved-length cap)."
    - keys: ["fontFamily"]
      cells:
        "Property": "`fontFamily`"
        "Type / values": "string (face id from the lang pack)"
        "Engine default": "pack default face"
        "Inherited": "yes"
        "Description": "Valid ids and the default: [fonts.md](fonts.md) (default `biz-udp-gothic`; also `biz-ud-gothic`, `ipamj-mincho`)."
    - keys: ["fontWeight"]
      cells:
        "Property": "`fontWeight`"
        "Type / values": "`normal` | `bold`"
        "Engine default": "`normal`"
        "Inherited": "yes"
        "Description": "`bold` selects the family's real bold face when it ships one (the `biz-*-gothic` families do); otherwise it renders as synthetic emboldening (glyphs stroked in the text color, advances unchanged — CSS faux bold)."
    - keys: ["fontStyle"]
      cells:
        "Property": "`fontStyle`"
        "Type / values": "`normal` | `italic`"
        "Engine default": "`normal`"
        "Inherited": "yes"
        "Description": "Synthetic baseline-anchored skew (~12°), advances unchanged."
    - keys: ["letterSpacing"]
      cells:
        "Property": "`letterSpacing`"
        "Type / values": "number (pt, negative allowed) or length string"
        "Engine default": "`0`"
        "Inherited": "yes"
        "Description": "Strings take `pt`/`mm`/`cm`/`in` or `em`/`rem` (`em` = the item's own computed fontSize); `%` is a parse error (CSS letter-spacing has none). Added to every character advance; measurement, wrapping, alignment, and drawing share the one policy. Magnitude capped at ±1000 pt (`invalid_letter_spacing` → 0)."
    - keys: ["lineHeight"]
      cells:
        "Property": "`lineHeight`"
        "Type / values": "number (multiplier of fontSize)"
        "Engine default": "`1.4`"
        "Inherited": "yes"
        "Description": "Non-positive/non-finite falls back with `invalid_line_height`; multipliers over 1000 fall back with `line_height_out_of_range`."
    - keys: ["color"]
      cells:
        "Property": "`color`"
        "Type / values": "`#rrggbb` string"
        "Engine default": "black"
        "Inherited": "yes"
        "Description": "Text color."
    - keys: ["textAlign"]
      cells:
        "Property": "`textAlign`"
        "Type / values": "`left` | `center` | `right`"
        "Engine default": "`left`"
        "Inherited": "yes"
        "Description": "On a vertical (`vertical_rl`) block the keyword names the line's end along the column (`right` = bottom). A `char_grid` honors it too — filling a partly filled line toward its end — but reads it from the ITEM only, never inherited ([char_grid.md](char_grid.md))."
    - keys: ["verticalAlign"]
      cells:
        "Property": "`verticalAlign`"
        "Type / values": "`top` | `middle` | `bottom`"
        "Engine default": "`top`"
        "Inherited": "no"
        "Description": "Vertical alignment within the item's box (needs a definite `h`, or `minHeight` slack). On a vertical (`vertical_rl`) block it maps CSS-logically to the column-stack shift: `top` → right edge, `middle` → centered, `bottom` → left edge ([vertical_text.md](vertical_text.md))."
    - keys: ["lineBreak"]
      cells:
        "Property": "`lineBreak`"
        "Type / values": "`normal` | `strict` | `loose` | `anywhere`"
        "Engine default": "`normal`"
        "Inherited": "yes"
        "Description": "CSS `line-break`. `normal`/`strict`/`loose` pick the CJK kinsoku strictness — `strict` also holds small kana/`ー`/`〜゠` off a line start, `loose` frees centered punctuation (`・：；！？`) and inseparables (`‥…`); `anywhere` breaks between any two characters with no kinsoku. Per-mode sets and migration: [text.md](text.md)."
    - keys: ["textSpacingTrim"]
      cells:
        "Property": "`textSpacingTrim`"
        "Type / values": "`space_all` | `normal` | `trim_start`"
        "Engine default": "`space_all`"
        "Inherited": "yes"
        "Description": "Half-width punctuation (CSS `text-spacing-trim` subset). `space_all` (the default) trims nothing — output is unchanged. `normal` trims the internal space between two adjacent fullwidth punctuation glyphs (e.g. `」「`, `、」`) to half-width; `trim_start` also trims a fullwidth opening bracket at a line head (a column head on a vertical block — [vertical_text.md](vertical_text.md)). Engine-synthesized after shaping (works on every face, not font-feature dependent). A v1 subset — see [text.md](text.md)."
    - keys: ["hangingPunctuation"]
      cells:
        "Property": "`hangingPunctuation`"
        "Type / values": "`none` | `allow_end` | `force_end`"
        "Engine default": "`none`"
        "Inherited": "yes"
        "Description": "Hanging punctuation (CSS `hanging-punctuation` subset). A line-terminating comma / full stop (`、。，．`) hangs past the end edge. `allow_end` hangs one that would otherwise wrap (keeping the line count down); `force_end` also excludes a *fitting* trailing comma from the alignment width so it hangs into the margin under center/right alignment. Plain text blocks in v1 (vertical columns hang on both the plain and `spans` paths — [vertical_text.md](vertical_text.md)). See [text.md](text.md)."
    - keys: ["backgroundColor"]
      cells:
        "Property": "`backgroundColor`"
        "Type / values": "`#rrggbb` string"
        "Engine default": "none"
        "Inherited": "no"
        "Description": "Filled rectangle covering the border box, under the content. Honored on text-drawing items, `container`, `repeat` cells, `image`, and `qr_code` boxes."
    - keys: ["borderWidth"]
      cells:
        "Property": "`borderWidth`"
        "Type / values": "number (pt) | `{ top/right/bottom/left }` map"
        "Engine default": "`0` (no border)"
        "Inherited": "no"
        "Description": "Border stroke over the border box, drawn iff a side's computed width > 0. The bare number is all four sides; the map is per side (unset side = 0; negative widths are parse errors). Does not change geometry (each side draws centered on the box edge). Capped 0..=1000 pt (`invalid_border_width`). On a `table` the map form draws the outer frame only ([table.md](table.md)). `rect` items use their own style shape instead."
    - keys: ["borderColor"]
      cells:
        "Property": "`borderColor`"
        "Type / values": "`#rrggbb` string | per-side map"
        "Engine default": "black"
        "Inherited": "no"
        "Description": "Inert while the side's width is 0 — a named style can carry a palette color items opt into with a width."
    - keys: ["borderStyle"]
      cells:
        "Property": "`borderStyle`"
        "Type / values": "`solid` | `double` | `dashed` | `dotted` | per-side map"
        "Engine default": "`solid`"
        "Inherited": "no"
        "Description": "`double` splits the side's width into two lines of a third each (CSS). `dashed` paints three stroke widths on and three off, `dotted` one and one; both intervals are floored at 0.25pt so a hair-thin border cannot explode the dash walk. A uniform border (one width, one colour, and any style except `double`) stays a single stroked rect carrying the pattern; a per-side or `double` border renders as filled bands per side, with each dashed/dotted side stroked as a centred line instead (corners overlap; paint order top/right/bottom/left)."
    - keys: ["borderRadius"]
      cells:
        "Property": "`borderRadius`"
        "Type / values": "number (pt) | length string"
        "Engine default": "`0` (square)"
        "Inherited": "no"
        "Description": "Rounds the border box's corners (CSS `border-radius`, single value — no per-corner form). `%` resolves against BOTH axes independently, so `50%` is a circle on a square box and a full ellipse on an oblong one; an absolute radius too large to fit shrinks by ONE uniform factor (CSS overlapping-curves rule), which is what makes a big value a stadium (\"pill\") rather than an ellipse. Honored on a box whose border is uniform, and on its `backgroundColor` fill. A per-side or `double` border, a `table`, or a form mark warns `border_radius_ignored` and draws square corners; a negative or non-finite value warns `invalid_border_radius`. `overflow: hidden` clips to the rounded box."
    - keys: ["textOverflow"]
      cells:
        "Property": "`textOverflow`"
        "Type / values": "`visible` | `shrink` | `ellipsis` | `clip`"
        "Engine default": "`visible`"
        "Inherited": "no"
        "Description": "What text does when it exceeds a **definite `box.h`** (auto-height boxes grow instead). On a vertical block the overflow axis is the box **width**, and a direct-flow `visible` overflow paginates by columns ([vertical_text.md](vertical_text.md)). See [text.md](text.md)."
    - keys: ["overflow"]
      cells:
        "Property": "`overflow`"
        "Type / values": "`visible` | `hidden`"
        "Engine default": "`visible`"
        "Inherited": "no"
        "Description": "What a container-like box (`container`, `repeat` cell, `repeat_flow` card) does with children outside its border box. `hidden` clips children to the border box (decoration stays outside — it *is* the box) and suppresses `container_overflow`; an auto-height box still clips horizontally. Inert on other items (text uses `textOverflow: clip`)."
    - keys: ["textDecoration"]
      cells:
        "Property": "`textDecoration`"
        "Type / values": "`none` | `underline` | `line_through`"
        "Engine default": "`none`"
        "Inherited": "no"
        "Description": "Decoration line on text (also `list` entries and table cells via the column style). Position/thickness come from the font's own metrics (post/OS2 tables, conventional fallback), drawn in the text color, sized to each line's measured width; follows `shrink` (computed at the final size) and pagination. On a vertical block it draws a SIDE band per column — underline right of the em cell (the JLREQ side-line convention), line-through on the column axis ([vertical_text.md](vertical_text.md)). Not inherited (matches CSS; decoration *propagation* is not modeled) — set it on the text item itself."
    - keys: ["opacity"]
      cells:
        "Property": "`opacity`"
        "Type / values": "number `0..=1`"
        "Engine default": "`1`"
        "Inherited": "no"
        "Description": "Paint alpha for the item's own painting: text glyphs + decoration line, `backgroundColor` fill, and border stroke alike. **Per-item paint alpha, not CSS group compositing** — nested items don't multiply, and a container's opacity does not affect its children. `rect`/`line` items take `opacity` in their own style shapes. Out-of-range warns `invalid_opacity` and draws opaque. QR modules ignore it (scannability)."
    - keys: ["writingMode"]
      cells:
        "Property": "`writingMode`"
        "Type / values": "`horizontal_tb` | `vertical_rl`"
        "Engine default": "`horizontal_tb`"
        "Inherited": "yes"
        "Description": "CSS `writing-mode` subset. `vertical_rl` turns a `type: text` item into a vertical block: characters fill top-to-bottom and columns lay out right-to-left. Honored on every text surface — plain text, rich `spans`, `list`, table text cells, `page_number`; a text `mark:` (the circled-text overlay) is the one warned fallback (`vertical_text_unsupported`). See [vertical_text.md](vertical_text.md)."
    - keys: ["textOrientation"]
      cells:
        "Property": "`textOrientation`"
        "Type / values": "`mixed` | `upright`"
        "Engine default": "`mixed`"
        "Inherited": "yes"
        "Description": "CSS `text-orientation` subset; consulted only inside a vertical block. `mixed` keeps CJK/kana upright and rotates Latin/digits 90° clockwise; `upright` keeps every character upright. See [vertical_text.md](vertical_text.md)."
    - keys: ["textCombineUpright"]
      cells:
        "Property": "`textCombineUpright`"
        "Type / values": "`none` | `{ digits: 2..=4 }` | `all`"
        "Engine default": "`none`"
        "Inherited": "yes"
        "Description": "Tate-chu-yoko (CSS `text-combine-upright` subset): `digits` makes runs of up to N consecutive ASCII digits share one upright cell of a vertical column; `all` combines the whole styled scope (meant for a short span) into one cell. Plain blocks, rich `spans` (per-span override), vertical `list` entries, and vertical [`char_grid`](char_grid.md) cells (digits only). Longer runs stay uncombined; out-of-range `digits` / unknown keywords are parse errors. Inert in horizontal text. See [vertical_text.md](vertical_text.md) § Tate-chu-yoko."

"table#columns":
  page: table
  node: Column
  coverage: full
  columns:
    - header: "Key"
      from: authored
    - header: "Type"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["label"]
      cells:
        "Key": "`label`"
        "Type": "string"
        "Description": "Header cell text (a `cell:` column's header is still a plain label). **Interpolates `{key}` like static text**, against **top-level** params — header chrome belongs to the document, not to any row — so `label: \"{labels.amount}\"` lets one template print its headings in whichever language the params carry. A label with no `{…}` resolves to itself."
    - keys: ["data"]
      cells:
        "Key": "`data`"
        "Type": "`{ key, format? }`"
        "Description": "Row-relative binding ([data-binding.md](data-binding.md)); `scope: document` reads top-level params instead, so a column can show one document-wide value (a `type: image` column then loads one shared asset rather than one per row). Exclusive with `cell`; one of the two is required."
    - keys: ["type"]
      cells:
        "Key": "`type`"
        "Type": "`text` | `qr_code` | `image`"
        "Description": "How the bound value renders (default `text`). `qr_code` encodes it at layout time; `image` loads it as a per-row asset — both scale to the row height and are detailed under [Spanning & non-text cells](#spanning--non-text-cells). Only meaningful with `data`."
    - keys: ["fit"]
      cells:
        "Key": "`fit`"
        "Type": "`contain` | `cover` | `stretch` | `none`"
        "Description": "Object-fit for a `type: image` column (default `contain`; same semantics as the [image item](image.md)). On any other column it warns `ignored_column_key`."
    - keys: ["cell"]
      cells:
        "Key": "`cell`"
        "Type": "container"
        "Description": "A per-row sub-template — see [Container cells](#container-cells). Exclusive with `data` / `type` / `fit`."
    - keys: ["width"]
      cells:
        "Key": "`width`"
        "Type": "[Length](length.md)"
        "Description": "`%` of the flow region width; physical units work; omitted = an **equal share of the leftover** after the sized columns (all omitted = an even split). Negative → 0 with `invalid_column_width`."
    - keys: ["style", "styleNames"]
      cells:
        "Key": "`style` / `styleNames`"
        "Type": ""
        "Description": "Cell styling: `backgroundColor`/border decorate the full cell; `textOverflow` becomes meaningful with fixed row heights."
    - keys: ["id"]
      cells:
        "Key": "`id`"
        "Type": "string"
        "Description": "One box-index placement per cell (header included), content box inset by the cell padding."

