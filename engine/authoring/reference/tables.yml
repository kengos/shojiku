"defaults#defaults":
  page: defaults
  node: TemplateDefaults
  coverage: full
  columns:
    - header: "Key"
      from: authored
    - header: "Meaning"
      from: authored
  rows:
    - keys: ["locale"]
      cells:
        "Key": "`locale`"
        "Meaning": "Document locale id (BCP 47, e.g. `ja-JP`). The CLI's fallback for picking the locale pack when `--lang` is absent (`--lang` > `defaults.locale` > `ja-JP`). Drives dates, currency display, grouping separators, and units."
    - keys: ["currency"]
      cells:
        "Key": "`currency`"
        "Meaning": "Document currency **code** (ISO 4217, e.g. `JPY`). The middle of the currency fallback chain: the field's `currency:` → `defaults.currency` → the pack's `currencyDefault` → `JPY`. Lets currency bindings stay a bare `{key}` with no per-field code."
    - keys: ["style"]
      cells:
        "Key": "`style`"
        "Meaning": "The cascade **root style**. Inherited properties ([style.md](style.md)) flow into every item; the `rem` root follows this style's computed `fontSize` (engine default 10pt when unset — see [length.md](length.md))."
    - keys: ["formats"]
      cells:
        "Key": "`formats`"
        "Meaning": "Per-type format defaults: `date` / `datetime` / `number` / `currency` / `percentage` / `quantity`, each a variant-name string **or** an inline `{ pattern: … }` map. Unknown type keys are parse errors."

