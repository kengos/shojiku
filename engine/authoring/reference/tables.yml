"image#keys":
  page: image
  node: Item.image
  coverage: full
  columns:
    - header: "Key"
      from: authored
    - header: "Type"
      from: authored
    - header: "Default"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["src"]
      cells:
        "Key": "`src`"
        "Type": "string"
        "Default": ""
        "Description": "Bundled path, `data:` URI, or inline SVG. A path resolves against the **assets root** — `--assets-dir`, defaulting to **the template file's directory** (so `examples/business/receipt-ja/templates.yml` can say `src: assets/logo.svg`); paths escaping the root are rejected (`asset_traversal`). Remote URLs are recognized and rejected (`remote_asset_unsupported` — the render path has no network I/O, and unlike a font there is no `sha256` pin that would make fetching an image deterministic)."
    - keys: ["data"]
      cells:
        "Key": "`data`"
        "Type": "`{ key }`"
        "Default": ""
        "Description": "Dynamic source from params; the host's asset policy (open vs bundled-only, per-item allow/deny via CLI `--allow/deny-dynamic-image`) gates it."
    - keys: ["bindings"]
      cells:
        "Key": "`bindings`"
        "Type": "map of name → binding"
        "Default": ""
        "Description": "Named declarations for the `{name}` interpolations in this item's `link.url` ([data-binding.md](data-binding.md#named-binding-declarations))."
    - keys: ["fit"]
      cells:
        "Key": "`fit`"
        "Type": "`contain` | `cover` | `stretch` | `none`"
        "Default": "`contain`"
        "Description": "CSS `object-fit`, all centered. `contain` preserves aspect ratio inside the box (letterbox); `cover` preserves aspect ratio filling the box and crops the overflow; `stretch` fills the box exactly (distorting); `none` draws at the asset's intrinsic size (raster px at 72dpi / SVG viewBox units). `cover`/`none` clip anything past the content box — and an **SVG clips under every fit** (see below)."
    - keys: ["box"]
      cells:
        "Key": "`box.w` / `box.h`"
        "Type": "[Length](length.md)"
        "Default": "required"
        "Description": "The fit box (inset by padding)."
    - keys: ["style", "styleNames"]
      cells:
        "Key": "`style` / `styleNames`"
        "Type": ""
        "Default": ""
        "Description": "Decoration (`backgroundColor`, `borderWidth`/`borderColor`) plus **`opacity`** (see below); text properties are unused."
    - keys: ["link"]
      cells:
        "Key": "`link`"
        "Type": "`{ url }`"
        "Default": ""
        "Description": "Hyperlink over the draw box. See [link.md](link.md)."
  omitted:
    "id": "item-common; documented on template.md"
    "type": "the discriminator — it is this page's own heading"
    "visible": "item-common; documented on visible.md"

"line#keys":
  page: line
  node: Item.line
  coverage: full
  columns:
    - header: "Key"
      from: authored
    - header: "Type"
      from: authored
    - header: "Default"
      from: authored
    - header: "Description"
      from: authored
  rows:
    - keys: ["from", "to"]
      cells:
        "Key": "`from` / `to`"
        "Type": "`{ x, y }` ([`Length`](length.md) each) **or** `{ item, edge?, offset? }`"
        "Default": "required"
        "Description": "Endpoints relative to the parent origin (margin box / flow region / container **content** box). `x` resolves against that box's width, `y` against its height; a bare number is pt. A `%` `y` under an auto-height parent has no basis — it warns `percent_of_auto` and drops to 0, like every other vertical `%`."
    - keys: ["from", "to"]
      cells:
        "Key": "`from.item` / `to.item`"
        "Type": "string (another item's `id:`)"
        "Default": "—"
        "Description": "Anchors this endpoint to that item's placement. Makes the whole line absolutely positioned; see above. No item with that id warns `anchor_unknown_target` and nothing is drawn."
    - keys: ["from", "to"]
      cells:
        "Key": "`from.edge` / `to.edge`"
        "Type": "`top` | `right` | `bottom` | `left` | `center`"
        "Default": "`center`"
        "Description": "Which point of the target's border box to land on — the `<anchor-side>` subset CSS Anchor Positioning Level 1 defines."
    - keys: ["from", "to"]
      cells:
        "Key": "`from.offset` / `to.offset`"
        "Type": "`{ x, y }` (pt numbers)"
        "Default": "`{ x: 0, y: 0 }`"
        "Description": "Shifts the resolved point. Either axis may be omitted."
    - keys: ["style"]
      cells:
        "Key": "`style.width`"
        "Type": "number (pt)"
        "Default": "`1`"
        "Description": "Stroke width. Capped 0..=1000 pt — it shares `borderWidth`'s bound, since both reach the renderers' stroke math directly. A negative, non-finite, or over-cap width warns `invalid_line_width` and strokes at the 1 pt default (unlike `borderWidth`, whose `0` legitimately means \"no border\", a `line` that strokes nothing draws nothing). An authored `0` passes through undiagnosed."
    - keys: ["style"]
      cells:
        "Key": "`style.color`"
        "Type": "`#rrggbb`"
        "Default": "black"
        "Description": "Stroke color."
    - keys: ["style"]
      cells:
        "Key": "`style.opacity`"
        "Type": "number `0..=1`"
        "Default": "`1`"
        "Description": "Paint alpha for the stroke. Out-of-range warns `invalid_opacity` and draws opaque."
    - keys: ["style"]
      cells:
        "Key": "`style.style`"
        "Type": "`solid` | `dashed` | `dotted` | `double`"
        "Default": "`solid`"
        "Description": "Stroke pattern, sharing the border wire's keyword set ([style.md](style.md)). `dashed` paints three widths on and three off, `dotted` one and one. `double` draws two parallel lines a third of the width each, offset either side of the authored geometry along its normal — so a diagonal doubles correctly. Advertised as the `line.style` capability."
