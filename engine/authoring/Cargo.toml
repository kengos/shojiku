[package]
name = "shojiku-authoring"
description = "Shojiku authoring surface: shared validate/prepare/preview/inspect/capabilities layer for the CLI, WASM bindings, and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Filesystem pack discovery (search dirs, overlay files) for the FS hosts
# (CLI, MCP server). Default-on so the crate's own tests cover it; a
# bytes-injecting host (WASM) builds with `default-features = false` to
# stay filesystem-free.
default = ["fs"]
fs = []
# Non-default: the key-catalog GENERATOR. The committed artifact is
# embedded either way; only regenerating it needs the schema derive, so a
# default build and the WASM bundle link none of schemars.
schema = ["dep:schemars", "shojiku-core/schema"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
shojiku-core = { workspace = true }
schemars = { workspace = true, optional = true }
shojiku-diagnostics = { workspace = true }
shojiku-formatter = { workspace = true }
shojiku-image = { workspace = true }
shojiku-layout = { workspace = true }
shojiku-render-png = { workspace = true }

[lints]
workspace = true

# The generator is skipped entirely unless the feature is on, so `cargo
# build`/`test`/`llvm-cov` never compile it.
[[bin]]
name = "reference-gen"
required-features = ["schema"]
