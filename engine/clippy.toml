# Function-length gate for clippy::too_many_lines (workspace lint).
# Counts non-comment lines; pairs with the 300-line file budget in
# scripts/check-line-budget.sh.
too-many-lines-threshold = 150

# The YAML door (shojiku_core::yaml) is the one place the engine reads and
# writes YAML: every refusal that does not depend on the document (input
# size, depth, duplicate and non-string keys, non-finite numbers, local tags)
# is made there, and the parser can be replaced in one module. A direct call
# to the parser crate would skip all of it. Only engine/core/src/yaml/ calls
# it, each use under an `#[expect(…, reason = …)]`; deny.toml holds the same
# line at the dependency level (no other crate may depend on serde-saphyr).
disallowed-methods = [
    { path = "serde_saphyr::from_str", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_str_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_slice", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_slice_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_reader", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_reader_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_multiple", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_multiple_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_str_multiple", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_str_multiple_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_slice_multiple", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_slice_multiple_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_bytes_multiple", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::from_bytes_multiple_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::read", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::read_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::with_deserializer_from_str", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::with_deserializer_from_str_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::with_deserializer_from_slice", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::with_deserializer_from_slice_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::with_deserializer_from_reader", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::with_deserializer_from_reader_with_options", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::to_string", reason = "write YAML through shojiku_core::yaml::to_string" },
    { path = "serde_saphyr::to_string_with_options", reason = "write YAML through shojiku_core::yaml::to_string" },
    { path = "serde_saphyr::to_fmt_writer", reason = "write YAML through shojiku_core::yaml::to_string" },
    { path = "serde_saphyr::to_io_writer", reason = "write YAML through shojiku_core::yaml::to_string" },
    { path = "serde_saphyr::to_fmt_writer_with_options", reason = "write YAML through shojiku_core::yaml::to_string" },
    { path = "serde_saphyr::to_io_writer_with_options", reason = "write YAML through shojiku_core::yaml::to_string" },
    { path = "serde_saphyr::to_string_multiple", reason = "write YAML through shojiku_core::yaml::to_string" },
    { path = "serde_saphyr::to_string_multiple_with_options", reason = "write YAML through shojiku_core::yaml::to_string" },
]
disallowed-types = [
    { path = "serde_saphyr::Error", reason = "use shojiku_core::yaml::YamlError" },
    { path = "serde_saphyr::Deserializer", reason = "read YAML through shojiku_core::yaml" },
    { path = "serde_saphyr::Serializer", reason = "write YAML through shojiku_core::yaml::to_string" },
]
