# Fuzz targets for the parsers that read attacker-chosen bytes.
#
# Deliberately OUTSIDE the engine workspace (`exclude = ["fuzz"]` there, its
# own `[workspace]` table here): `cargo test --workspace`, `cargo llvm-cov
# --workspace` and `cargo deny` all scope to the workspace, and none of them
# should grow a nightly-only, libFuzzer-linked member. Nothing here ships —
# no gate builds it, no artifact contains it, and `make engine:fuzz` is the only
# thing that compiles it.
[package]
name = "shojiku-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0 OR BSD-3-Clause"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
shojiku-core = { path = "../core" }
shojiku-formatter = { path = "../formatter" }
shojiku-signing = { path = "../signing" }
shojiku-verify = { path = "../verify" }

# libFuzzer wants line numbers in its crash reports; full debug info would
# quadruple the build for nothing.
[profile.release]
debug = 1

[lib]
name = "shojiku_fuzz"
path = "src/lib.rs"
test = false
doc = false
bench = false

# The seed generator is an EXAMPLE rather than a bin so `cargo fuzz list`
# keeps naming fuzz targets only.
[[example]]
name = "seed"
path = "examples/seed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_document"
path = "fuzz_targets/pdf_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_document"
path = "fuzz_targets/verify_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contents_window"
path = "fuzz_targets/contents_window.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cms_container"
path = "fuzz_targets/cms_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trust_anchors"
path = "fuzz_targets/trust_anchors.rs"
test = false
doc = false
bench = false

# The authored-wire doors. Every one takes a `&str`, so its target decodes
# UTF-8 and discards the rest — fuzzing the decoder is not the point.
[[bin]]
name = "core_template"
path = "fuzz_targets/core_template.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_params"
path = "fuzz_targets/core_params.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_definitions"
path = "fuzz_targets/core_definitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_ruby"
path = "fuzz_targets/core_ruby.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formatter_langpack"
path = "fuzz_targets/formatter_langpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formatter_fontpack"
path = "fuzz_targets/formatter_fontpack.rs"
test = false
doc = false
bench = false
