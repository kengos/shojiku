[build-system]
# hatchling, not maturin: this package is a ctypes binding with NO Rust source
# of its own, so a Rust-building backend would compile the engine inside the
# wheel build — contradicting the rule that the engine binary is injected
# already compiled. The platform wheels carry that prebuilt cdylib as package
# data, exactly as the ruby platform gems carry theirs.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shojiku"
dynamic = ["version"]
description = "Deterministic PDF documents from a YAML template plus your data"
readme = "README.md"
authors = [{ name = "kengos", email = "kengo@kengos.jp" }]
# The workspace's tri-license, as an SPDX expression.
license = "MIT OR Apache-2.0 OR BSD-3-Clause"
license-files = ["../../LICENSE-*"]
# The policy, from docs/agents/sdk.md: every upstream line that is not
# end-of-life, minus those whose support ends within six months.
requires-python = ">=3.11"
# EXACTLY none, and a test pins it. The transport is ctypes, which is stdlib —
# the same reason the ruby reference has only fiddle.
dependencies = []
keywords = ["pdf", "invoice", "receipt", "template", "document"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Printing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kengos/shojiku"
Source = "https://github.com/kengos/shojiku/tree/main/sdk/python"
Documentation = "https://github.com/kengos/shojiku/blob/main/docs/engine/README.md"

[tool.hatch.version]
path = "src/shojiku/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shojiku"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtin shadowing
  "C4",          # comprehensions
  "PL",          # pylint
  "PT",          # pytest style
  "RET",         # return discipline
  "SIM",         # simplify
  "TID",         # tidy imports
  "ARG",         # unused arguments
  "PTH",         # prefer pathlib
  "RUF",
]
ignore = [
  # The binding's own docstrings carry the contract's reasoning; a missing
  # one-liner on a private helper is not worth a gate.
  "D",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose (the ownership and boundary
# proofs), and their fixtures are deliberately hostile strings.
"tests/*" = ["SLF001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/shojiku"]
strict = true
# ctypes' foreign-function objects are `Any` by construction: the whole point of
# `Library.function` is to hand back a callable whose signature was declared at
# runtime. Every OTHER expression stays strictly typed.
disallow_any_expr = false
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=100 -p no:randomly"

[tool.coverage.run]
source = ["shojiku"]
branch = false

[tool.coverage.report]
exclude_also = [
  # `if TYPE_CHECKING:` bodies never execute at runtime by design.
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
