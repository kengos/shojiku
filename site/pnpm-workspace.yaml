# Standalone pnpm project (the site is not a gui/ workspace member — it is a
# different deploy target with its own lifecycle). The supply-chain posture
# mirrors gui/pnpm-workspace.yaml, where the rationale comments live:
# build-script allowlisting + a 7-day minimum release age that is enforced at
# install time (including --frozen-lockfile), so a freshly compromised release
# cannot reach a build.
packages:
  - .

# esbuild's postinstall places its native binary — the one reviewed build
# script this project allows (pnpm 11's allowBuilds spelling).
allowBuilds:
  esbuild: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

# Transitive advisory pins — same mechanism and lifetime rules as
# gui/pnpm-workspace.yaml (where the full rationale lives): `pnpm update`
# cannot reach a transitive dep whose parent range is already satisfied, so
# each entry pins past the advisory until the parent (vitepress) widens its
# own range — drop it then and re-run `make lock:site`. Neither version is
# young enough to need a minimumReleaseAgeExclude entry.
overrides:
  vite@<=6.4.2: ^6.4.3
  esbuild@<=0.24.2: ^0.25.0
