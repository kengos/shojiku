version: "0.1.0"
page: { size: A5, margin: 24 }
defaults: { locale: en-US }
sections:
  body:
    type: flow
    gap: 14
    items:
      - type: line
        from: { x: 0, y: 0 }
        to: { x: "100%", y: 0 }
        style: { width: 0.8, color: "#1a3c6e" }
      - type: line
        from: { x: 0, y: 0 }
        to: { x: "100%", y: 0 }
        style: { width: 1.2, color: "#a8674f", style: dashed }
      - type: text
        box: { w: "100%" }
        text: A line has no box — from/to resolve against the parent's content box.
        style: { fontSize: 10 }
