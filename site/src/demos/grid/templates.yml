version: "0.1.0"
page: { size: A5, margin: 24 }
defaults: { locale: en-US }
sections:
  body:
    type: flow
    gap: 10
    items:
      - type: container
        box: { w: "100%", type: grid, columns: ["1fr", "2fr"], gap: 8 }
        items:
          - type: rect
            box: { w: "100%", h: 30 }
            style: { backgroundColor: "#1a3c6e" }
          - type: rect
            box: { w: "100%", h: 30 }
            style: { backgroundColor: "#a8674f" }
          - type: rect
            box: { w: "100%", h: 30 }
            style: { backgroundColor: "#1a3c6e" }
          - type: rect
            box: { w: "100%", h: 30 }
            style: { backgroundColor: "#a8674f" }
      - type: text
        box: { w: "100%" }
        text: "Two tracks weighted 1fr and 2fr; children fill them in order."
        style: { fontSize: 10 }
