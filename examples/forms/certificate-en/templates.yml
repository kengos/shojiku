version: 0.1.0
name: certificate_en

# Letter-landscape certificate of completion — the English counterpart of
# examples/certificate-ja: double-rule frame, wide letter spacing, real
# italic (noto-sans ships one), medal SVG, verification QR. en-US locale
# formats the completion date.
page:
  size: Letter
  orientation: landscape
  margin: 25

defaults:
  locale: en-US
  style:
    color: "#2b2b2b"

styles:
  Heading 1:
    fontSize: 20
    fontWeight: bold
    lineHeight: 1.3
  Heading 2:
    fontSize: 16
    fontWeight: bold
    lineHeight: 1.3
  Heading 3:
    fontSize: 13
    fontWeight: bold
    lineHeight: 1.3
    color: "#444444"
  Body:
    fontSize: 10.5
    lineHeight: 1.5
  Caption:
    fontSize: 9
    lineHeight: 1.4
    color: "#666666"

sections:
  body:
    type: absolute
    items:
      # Parchment ground — bleeds past the margin box.
      - type: rect
        box: { x: -25, y: -25, w: 792, h: 612 }
        style: { backgroundColor: "#fdfbf4" }
      # Double frame + inner hairline.
      - type: rect
        box: { x: 6, y: 6, w: 730, h: 550 }
        style: { borderWidth: 4, borderStyle: double, borderColor: "#b7883f" }
      - type: rect
        box: { x: 16, y: 16, w: 710, h: 530 }
        style: { borderWidth: 0.6, borderColor: "#b7883f" }

      - type: text
        box: { x: 36, y: 32, w: 300, h: 14 }
        text: "Certificate No. {certificate.number}"
        style: { fontSize: 9, color: "#6d5638", lineHeight: 1.4 }

      - type: text
        box: { x: 0, y: 58, w: "100%", h: 42 }
        text: CERTIFICATE
        style: { fontSize: 32, textAlign: center, lineHeight: 1.3, letterSpacing: 8, fontWeight: bold, color: "#2b2b2b" }
      - type: text
        box: { x: 0, y: 104, w: "100%", h: 16 }
        text: OF COMPLETION
        style: { fontSize: 11, textAlign: center, lineHeight: 1.4, letterSpacing: 6, color: "#6d5638" }

      - type: text
        box: { x: 0, y: 152, w: "100%", h: 15 }
        text: This certifies that
        style: { fontSize: 10.5, textAlign: center, fontStyle: italic, color: "#6d5638", lineHeight: 1.4 }

      - type: text
        box: { x: 0, y: 177, w: "100%", h: 34 }
        data: { key: recipient.name }
        style: { fontSize: 23, textAlign: center, fontWeight: bold, lineHeight: 1.4 }
      - type: line
        from: { x: 246, y: 216 }
        to: { x: 496, y: 216 }
        style: { width: 0.8, color: "#b7883f" }

      - type: text
        box: { x: 121, y: 240, w: 500, h: 66 }
        text: |-
          has successfully completed the {course.sessions}-session course
          "{course.name}" ({course.hours} hours) at Shojikudo Culture School.
        style: { fontSize: 12, textAlign: center, lineHeight: 2.0 }

      - type: text
        box: { x: 0, y: 322, w: "100%", h: 16 }
        text: "Completed on {course.completed_on}"
        style: { fontSize: 11, textAlign: center, lineHeight: 1.4 }

      # Signature (right) + medal (left).
      - type: image
        box: { x: 84, y: 366, w: 92, h: 108 }
        src: assets/medal.svg
      - type: line
        from: { x: 452, y: 434 }
        to: { x: 668, y: 434 }
        style: { width: 0.6, color: "#6d5638" }
      - type: text
        box: { x: 452, y: 440, w: 216, h: 14 }
        text: "{issuer.director}, Director"
        style: { fontSize: 10, textAlign: center, lineHeight: 1.4 }
      - type: text
        box: { x: 452, y: 456, w: 216, h: 12 }
        text: Shojikudo Culture School
        style: { fontSize: 8.5, textAlign: center, color: "#6d5638", lineHeight: 1.4 }

      # Verification QR.
      - id: verify_qr
        type: qr_code
        box: { x: 654, y: 40, w: 48, h: 48 }
        data: { key: certificate.verify_url }
      - type: text
        box: { x: 642, y: 92, w: 72, h: 10 }
        text: Verify online
        link: { url: "{certificate.verify_url}" }
        style: { fontSize: 6.5, textAlign: center, color: "#6d5638", lineHeight: 1.3 }

      - type: text
        box: { x: 0, y: 512, w: "100%", h: 12 }
        text: Issued by Shojikudo Culture School — Jimbocho, Tokyo
        style: { fontSize: 8, textAlign: center, color: "#8a7a5c", lineHeight: 1.4 }
