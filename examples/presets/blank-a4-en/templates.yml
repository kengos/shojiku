version: 0.1.0
name: blank_a4_en

page:
  size: A4
  margin: 25

defaults:
  locale: en-US
  style:
    fontFamily: noto-sans
    fontSize: 10.5

styles:
  Heading 1:
    fontSize: 20
    fontWeight: bold
    lineHeight: 1.3
  Heading 2:
    fontSize: 16
    fontWeight: bold
    lineHeight: 1.3
  Heading 3:
    fontSize: 13
    fontWeight: bold
    lineHeight: 1.3
    color: "#444444"
  Body:
    fontSize: 10.5
    lineHeight: 1.5
  Caption:
    fontSize: 9
    lineHeight: 1.4
    color: "#666666"

sections:
  body:
    type: flow
    items: []
