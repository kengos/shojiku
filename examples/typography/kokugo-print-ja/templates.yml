version: 0.1.0
name: kokugo_print_ja

# A school kokugo (Japanese-language) worksheet — char_grid throughout:
# horizontal kanji-practice cells (readings via Aozora ruby notation, the
# rest left blank), vertical copying cells (transcribe the passage into the
# empty columns), answer cells, and name entry cells. The passage is the
page:
  size: A4
  orientation: portrait
  margin: 25

defaults:
  locale: ja-JP

styles:
  sectionLabel:
    fontSize: 11
    fontWeight: bold
    lineHeight: 1.4
    color: "#1a3c6e"
  question:
    fontSize: 10.5
    lineHeight: 1.6

sections:
  body:
    type: flow
    box: { x: 0, y: 0, w: "100%", h: 745 }
    gap: 10
    items:
      # ---- Header: title + name cells ----
      - id: head
        type: container
        box: { h: 44 }
        items:
          - type: text
            box: { x: 0, y: 4, w: 250, h: 20 }
            text: こくごプリント ⑫
            style: { fontSize: 15, fontWeight: bold, lineHeight: 1.3 }
          - type: text
            box: { x: 0, y: 28, w: 250, h: 13 }
            text: "{print.date}　せいじつ小学校 ３年"
            style: { fontSize: 9, lineHeight: 1.3, color: "#555555" }
          - id: name_row
            type: container
            box: { x: 285, y: 8, w: 260.28, h: 30, direction: row, gap: 6, alignItems: center }
            items:
              - { type: text, box: { w: 34 }, text: 名前, style: { fontSize: 10, lineHeight: 1.3 } }
              - type: char_grid
                box: { w: 216 }
                data: { key: student.name }
                grid: { charsPerLine: 8, lines: 1, cellSize: 27 }
      - type: line
        from: { x: 0, y: 0 }
        to: { x: 545.28, y: 0 }
        style: { width: 1.2, color: "#1a3c6e" }

      # ---- 1. Kanji practice ----
      - type: text
        text: ① 漢字のれんしゅう　（よみがなを見て、となりのマスに練習しましょう）
        styleNames: [ sectionLabel ]
      - id: kanji_grid
        type: char_grid
        box: { w: 392 }
        markup: aozora
        text: |-
          ｜海《うみ》海
          ｜星《ほし》星
          ｜走《はし》る
          ｜書《か》く
        grid: { charsPerLine: 14, lines: 4, cellSize: 28, lineGap: 14 }

      # ---- 2. Copying practice (vertical) ----
      - type: text
        text: ② 視写　（縦書きの文をよく読んで、あいている列に書き写しましょう）
        styleNames: [ sectionLabel ]
      - id: shisha_grid
        type: char_grid
        box: { w: 420, margin: { left: auto, right: auto } }
        markup: aozora
        text: メロスは｜激怒《げきど》した。必ず、かの｜邪智暴虐《じゃちぼうぎゃく》の王を除かなければならぬと決意した。メロスには政治がわからぬ。
        writingMode: vertical_rl
        grid: { charsPerLine: 12, lines: 13, cellSize: 20, lineGap: 11 }

      # ---- 3. Questions ----
      - type: text
        text: ③ もんだい
        styleNames: [ sectionLabel ]
      - type: text
        text: （１）メロスが決意したことは何ですか。文の中のことばを使って書きましょう。
        styleNames: [ question ]
      - id: answer1
        type: char_grid
        box: { w: 375 }
        text: ""
        grid: { charsPerLine: 15, lines: 2, cellSize: 24, lineGap: 6 }
      - type: text
        text: （２）「げきど」を漢字二字で書きましょう。
        styleNames: [ question ]
      - id: answer2
        type: char_grid
        box: { w: 60 }
        text: ""
        grid: { charsPerLine: 2, lines: 1, cellSize: 30 }

  footer:
    repeat: every_page
    height: 30
    items:
      - type: page_number
        box: { x: 0, y: 774, w: "100%", h: 13 }
        format: "- {page} -"
        style: { fontSize: 9, textAlign: center }
