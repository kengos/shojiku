version: 0.1.0
name: kokugo_print_ja

# A school kokugo (Japanese-language) reading-comprehension worksheet:
# a framed vertical passage (Run, Melos! — public domain) with ruby, then
# three vertical questions read right-to-left, each with its own answer
# area (a bracket box, kanji cells, or fill-in parens). Name entry uses
page:
  size: A4
  orientation: portrait
  margin: 25

defaults:
  locale: ja-JP

styles:
  sectionLabel:
    fontSize: 11
    fontWeight: bold
    lineHeight: 1.4
    color: "#1a3c6e"
  question:
    fontSize: 10.5
    lineHeight: 1.6

sections:
  body:
    type: flow
    box: { x: 0, y: 0, w: "100%", h: 745 }
    gap: 10
    items:
      # ---- Header: title + name cells ----
      - id: head
        type: container
        box: { h: 44 }
        items:
          - type: text
            box: { x: 0, y: 4, w: 250, h: 20 }
            text: こくごプリント ⑫
            style: { fontSize: 15, fontWeight: bold, lineHeight: 1.3 }
          - type: text
            box: { x: 0, y: 28, w: 250, h: 13 }
            text: "{print.date}　せいじつ小学校 ３年"
            style: { fontSize: 9, lineHeight: 1.3, color: "#555555" }
          - id: name_row
            type: container
            box: { x: 285, y: 8, w: 260.28, h: 30, direction: row, gap: 6, alignItems: center }
            items:
              - { type: text, box: { w: 34 }, text: 名前, style: { fontSize: 10, lineHeight: 1.3 } }
              - type: char_grid
                box: { w: 216 }
                data: { key: student.name }
                grid: { charsPerLine: 8, lines: 1, cellSize: 27 }
      - type: line
        from: { x: 0, y: 0 }
        to: { x: 545.28, y: 0 }
        style: { width: 1.2, color: "#1a3c6e" }

      # ---- Passage (framed, vertical, with ruby) ----
      - type: text
        text: つぎの文章を読んで、もんだいに答えましょう。
        styleNames: [ sectionLabel ]
      - id: passage
        type: container
        box: { h: 195 }
        items:
          - type: rect
            box: { x: 0, y: 0, w: 545.28, h: 195 }
            style: { borderWidth: 1.2, borderColor: "#5aa7c7", borderRadius: 8 }
          - id: passage_text
            type: text
            box: { x: 16, y: 15, w: 513.28, h: 165 }
            text: |-
              　メロスは激怒した。必ず、かの邪智暴虐の王を除かなければならぬと決意した。メロスには政治がわからぬ。メロスは、村の牧人である。笛を吹き、羊と遊んで暮して来た。けれども邪悪に対しては、人一倍に敏感であった。
              　きょう未明メロスは村を出発し、野を越え山越え、十里はなれた此のシラクスの市にやって来た。メロスには父も、母も無い。女房も無い。十六の、内気な妹と二人暮しだ。この妹は、村の或る律気な一牧人を、近々、花婿として迎える事になっていた。結婚式も間近かなのである。メロスは、それゆえ、花嫁の衣裳やら祝宴の御馳走やらを買いに、はるばる市にやって来たのだ。先ず、その品々を買い集め、それから都の大路をぶらぶら歩いた。メロスには竹馬の友があった。セリヌンティウスである。
            rubySize: 5
            ruby:
              - { base: 激怒, text: げきど }
              - { base: 邪智暴虐, text: じゃちぼうぎゃく }
              - { base: 牧人, text: ぼくじん }
              - { base: 未明, text: みめい }
              - { base: 律気, text: りちぎ }
              - { base: 花婿, text: はなむこ }
              - { base: 御馳走, text: ごちそう }
              - { base: 竹馬, text: ちくば }
            style:
              writingMode: vertical_rl
              fontSize: 10.5
              lineHeight: 1.9
              lineBreak: strict
              hangingPunctuation: allow_end
              textSpacingTrim: normal
      - type: text
        text: （太宰治「走れメロス」より）
        style: { fontSize: 8, textAlign: right, color: "#777777", lineHeight: 1.3 }

      # ---- Questions (vertical, read right to left) ----
      - type: text
        text: もんだい
        styleNames: [ sectionLabel ]
      - id: questions
        type: container
        box: { h: 360, direction: row, gap: 16 }
        items:
          # Listed left to right; the reading order is (1) on the right.
          # `flexBasis: 0` + `flexGrow: 1` gives each question an equal third of
          # the row — the inner `margin: { left: auto }` needs that free space.
          - id: q3
            type: container
            box: { direction: row, gap: 10, flexBasis: 0, flexGrow: 1 }
            items:
              - id: q3_quote
                type: text
                box: { w: 44, h: 330, margin: { top: 16, left: auto } }
                text: 「（　　）を越え（　　）越え、十里はなれた此のシラクスの市にやって来た。」
                style: { writingMode: vertical_rl, fontSize: 10.5, lineHeight: 1.9, textCombineUpright: { digits: 2 } }
              - id: q3_text
                type: text
                box: { w: 44, h: 344 }
                text: （３）メロスは、どこを通ってシラクスの市にやって来ましたか。（　　）に合うことばを書きましょう。（一つ10てん）
                styleNames: [ question ]
                style: { writingMode: vertical_rl, textCombineUpright: { digits: 2 } }
          - id: q2
            type: container
            box: { direction: row, gap: 10, flexBasis: 0, flexGrow: 1 }
            items:
              - id: q2_answer
                type: char_grid
                box: { w: 30, margin: { top: 40, left: auto } }
                text: ""
                writingMode: vertical_rl
                grid: { charsPerLine: 2, lines: 1, cellSize: 27 }
              - id: q2_text
                type: text
                box: { w: 40, h: 344 }
                text: （２）メロスの仕事は何ですか。漢字二字で書きましょう。（10てん）
                styleNames: [ question ]
                style: { writingMode: vertical_rl, textCombineUpright: { digits: 2 } }
          - id: q1
            type: container
            box: { direction: row, gap: 10, flexBasis: 0, flexGrow: 1 }
            items:
              - id: q1_answer
                type: rect
                box: { w: 48, h: 300, margin: { top: 24, left: auto } }
                style: { borderWidth: 1.2, borderColor: "#5aa7c7", borderRadius: 6 }
              - id: q1_text
                type: text
                box: { w: 40, h: 344 }
                text: （１）メロスは、何を決意しましたか。文の中のことばを使って書きましょう。（10てん）
                styleNames: [ question ]
                style: { writingMode: vertical_rl, textCombineUpright: { digits: 2 } }

  footer:
    repeat: every_page
    height: 30
    items:
      - type: page_number
        box: { x: 0, y: 774, w: "100%", h: 13 }
        format: "- {page} -"
        style: { fontSize: 9, textAlign: center }
