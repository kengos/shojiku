version: 0.1.0
name: receipt_ja

page:
  size: A4
  orientation: portrait
  margin: 25 # the margin box is the coordinate origin: x/y 0 = 25pt in

# Document presentation defaults (FR1): currency renders on its symbol
# form (¥5,000) everywhere — placements just bind the key.
defaults:
  # Document presentation defaults (DF1): the locale drives the pack
  # (dates/currency/units) and the currency code fills the middle of the
  # currency fallback chain, so bindings stay `{key}` with no per-field code.
  locale: ja-JP
  currency: JPY
  formats:
    currency: symbol

# Named styles (CSS classes): reusable style bags items reference by
# `styleNames`. Layered below an item's inline `style`.
styles:
  見出し1:
    fontSize: 20
    fontWeight: bold
    lineHeight: 1.3
  見出し2:
    fontSize: 16
    fontWeight: bold
    lineHeight: 1.3
  見出し3:
    fontSize: 13
    fontWeight: bold
    lineHeight: 1.3
    color: "#444444"
  本文:
    fontSize: 10.5
    lineHeight: 1.5
  キャプション:
    fontSize: 9
    lineHeight: 1.4
    color: "#666666"
  heading:
    fontSize: 24
    textAlign: center
    lineHeight: 1.2
  amount:
    textAlign: right
    lineHeight: 1.2

sections:
  header:
    repeat: every_page
    height: 100
    items:
      - id: title
        type: text
        box: { x: 0, y: 17, w: 545.28, h: 30 }
        text: 領　収　書
        styleNames: [ heading ]
        style: { backgroundColor: "#f2f2f2" }

      - id: receipt_no
        type: text
        box: { x: 295, y: 57, w: 250.28, h: 12 }
        text: "No. {receipt.number}"
        style: { fontSize: 9, textAlign: right, lineHeight: 1.2 }

      - id: issued_at
        type: text
        box: { x: 295, y: 71, w: 250.28, h: 12 }
        text: "発行日 {receipt.issued_at:date}"
        style: { fontSize: 9, textAlign: right, lineHeight: 1.2 }

  body:
    type: flow
    # 545.28 = A4 width 595.28 − 25pt margins ×2 (`w: "100%"` of the
    # margin box is equivalent; kept explicit for coordinate-exact diffs)
    box: { x: 0, y: 105, w: 545.28, h: 620 }
    gap: 16
    items:
      # Addressee — container establishes the underline width once.
      - id: recipient
        type: container
        box: { h: 34 }
        items:
          - type: text
            box: { x: 0, y: 0, w: "60%", h: 24 }
            text: "{recipient.name} 様"
            style: { fontSize: 16 }
          # Lines are pt-only in box-model Phase 1: 60% of 545.28.
          - type: line
            from: { x: 0, y: 28 }
            to: { x: 327.17, y: 28 }
            style: { width: 0.8 }

      # Amount — the container draws its own border (box decoration).
      - id: amount_box
        type: container
        box: { x: "10%", w: "80%", h: 56 }
        style: { borderWidth: 1.2 }
        items:
          - type: text
            box: { x: "3%", y: 20, w: 60, h: 16 }
            text: 金額
            style: { fontSize: 11 }
          - type: text
            box: { x: 0, y: 14, w: "100%", h: 28 }
            text: "{amount.total_in_tax}−"
            style: { fontSize: 22, textAlign: center, lineHeight: 1.2 }

      - id: purpose
        type: text
        text: 但し {purpose} として、上記正に領収いたしました。
        style: { fontSize: 11 }

      - id: items_table
        type: table
        data: { key: items }
        autoPageBreak: true
        repeatHeader: true
        emptyBehavior: collapse
        row:
          minHeight: 22
        columns:
          - id: name
            label: 品目
            data: { key: name }
            width: 285.28
          - id: quantity
            label: 数量
            data: { key: quantity }
            width: 60
            style: { textAlign: right }
          - id: unit_price
            label: 単価
            data: { key: unit_price }
            width: 100
            style: { textAlign: right }
          - id: amount
            label: 金額
            data: { key: amount }
            width: 100
            style: { textAlign: right }

      # Totals — right-aligned summary block positioned with %.
      - id: totals
        type: container
        box: { x: "55%", w: "45%" }
        items:
          - type: text
            box: { x: 0, y: 0, w: "100%", h: 14 }
            text: "税抜金額 {amount.total_ex_tax}"
            style: { fontSize: 10, textAlign: right }
          - type: text
            box: { x: 0, y: 16, w: "100%", h: 14 }
            text: "消費税（10%） {amount.tax}"
            style: { fontSize: 10, textAlign: right }
          - type: text
            box: { x: 0, y: 34, w: "100%", h: 18 }
            text: "合計 {amount.total_in_tax}"
            styleNames: [ amount ]
            style: { fontSize: 13 }

      # Issuer — revenue-stamp box (nested container) + logo + issuer info.
      - id: issuer_block
        type: container
        box: { h: 96 }
        items:
          - id: stamp_box
            type: container
            box: { x: 0, y: 8, w: 70, h: 80 }
            style: { borderWidth: 0.8 }
            items:
              - type: text
                box: { x: 0, y: 0, w: "100%", h: "100%" }
                text: 収入印紙
                style: { fontSize: 9, textAlign: center, verticalAlign: middle }
          # No x/y -> a flex child; `margin.left: auto` hugs the right
          # edge (no magic 55% to keep in sync with the width) while the
          # text inside stays left-aligned.
          - id: issuer_info
            type: container
            box: { w: "45%", margin: { top: 8, left: auto } }
            items:
              - id: logo
                type: image
                box: { x: 0, y: 2, w: 36, h: 36 }
                src: assets/logo.svg
              - type: text
                box: { x: 44, y: 10, w: "80%", h: 18 }
                data: { key: issuer.name }
                style: { fontSize: 13, lineHeight: 1.2 }
              - type: text
                box: { x: 0, y: 48, w: "100%", h: 12 }
                data: { key: issuer.address }
                style: { fontSize: 9, lineHeight: 1.2 }
              - type: text
                box: { x: 0, y: 62, w: "100%", h: 12 }
                data: { key: issuer.tel }
                style: { fontSize: 9, lineHeight: 1.2 }

  footer:
    repeat: every_page
    height: 60
    items:
      # Per-document verification QR supplied via params as a pre-rendered
      # image — this item demos the DYNAMIC-IMAGE path and its asset policy
      # (--asset-mode / --deny-dynamic-image). For QR specifically the
      # native `type: qr_code` item (see examples/event-tickets-ja) is the
      # first-choice spelling: the engine encodes the string itself, no
      # image pipeline involved.
      - id: verification_qr
        type: image
        box: { x: 505, y: 745, w: 40, h: 40 }
        data: { key: qr_code }

      - id: page_no
        type: page_number
        box: { x: 0, y: 780, w: 545.28, h: 14 }
        format: "{page} / {pages}"
        style:
          fontSize: 9
          textAlign: center
