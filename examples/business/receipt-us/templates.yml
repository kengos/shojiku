version: 0.1.0
name: receipt_us

# 80mm thermal roll: custom page size in physical units (80mm ≈ 226.77pt).
page:
  size: { w: 80mm, h: 220mm }
  margin: 12

# Currency renders as $-prefixed everywhere (FR1 document default).
defaults:
  # Document presentation defaults (DF1): en-US selects the pack and USD
  # the document currency code.
  locale: en-US
  currency: USD
  formats:
    currency: symbol

styles:
  Heading 1:
    fontSize: 20
    fontWeight: bold
    lineHeight: 1.3
  Heading 2:
    fontSize: 16
    fontWeight: bold
    lineHeight: 1.3
  Heading 3:
    fontSize: 13
    fontWeight: bold
    lineHeight: 1.3
    color: "#444444"
  Body:
    fontSize: 10.5
    lineHeight: 1.5
  Caption:
    fontSize: 9
    lineHeight: 1.4
    color: "#666666"

sections:
  body:
    type: flow # no `box`: the flow fills the whole margin box
    gap: 7
    items:
      - id: store_name
        type: text
        data: { key: store.name }
        style: { fontSize: 14, textAlign: center }

      - id: store_info
        type: text
        text: |-
          {store.address}
          {store.phone}
        style: { fontSize: 8, textAlign: center, lineHeight: 1.5 }

      - id: rule_top
        type: line
        from: { x: 0, y: 2 }
        to: { x: 202.77, y: 2 }
        style: { width: 0.6 }

      - id: sale_info
        type: text
        text: "{sale.timestamp}  {sale.register}  {sale.cashier}"
        style: { fontSize: 8, textAlign: center }

      - id: items_table
        type: table
        data: { key: items }
        autoPageBreak: true
        repeatHeader: false
        emptyBehavior: collapse
        cellPadding: 2
        row:
          minHeight: 13
        columns:
          - id: name
            label: ITEM
            data: { key: name }
            width: 116.77
          - id: qty
            label: QTY
            data: { key: qty }
            width: 26
            style: { textAlign: right, fontSize: 8 }
          - id: price
            label: PRICE
            data: { key: price }
            width: 60
            style: { textAlign: right, fontSize: 8 }

      # Totals — right-aligned block positioned with % of the flow width.
      - id: totals
        type: container
        box: { x: "35%", w: "65%" }
        items:
          - type: text
            box: { x: 0, y: 0, w: "100%", h: 11 }
            text: "SUBTOTAL {amount.subtotal}"
            style: { fontSize: 9, textAlign: right, lineHeight: 1.2 }
          - type: text
            box: { x: 0, y: 13, w: "100%", h: 11 }
            text: "{amount.tax_label} {amount.tax}"
            style: { fontSize: 9, textAlign: right, lineHeight: 1.2 }
          - type: text
            box: { x: 0, y: 28, w: "100%", h: 15 }
            text: "TOTAL {amount.total}"
            style: { fontSize: 12, textAlign: right, lineHeight: 1.2 }

      - id: payment
        type: text
        data: { key: sale.payment }
        style: { fontSize: 8, textAlign: center }

      - id: rule_bottom
        type: line
        from: { x: 0, y: 2 }
        to: { x: 202.77, y: 2 }
        style: { width: 0.6 }

      - id: thanks
        type: text
        text: THANK YOU FOR SHOPPING!
        style: { fontSize: 10, textAlign: center }

      - id: copy_note
        type: text
        text: "*** CUSTOMER COPY ***"
        style: { fontSize: 8, textAlign: center }
