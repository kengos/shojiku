version: 0.1.0
name: shipping_labels_ja

# Shipping-label imposition: 2×3 = 6 labels per A4 sheet. `repeat` tiles the
# order array; the 7th order rolls to the next sheet automatically. The 〒 is
# entry cells (char_grid), contents a `list` (overflow becomes a +N line),
page:
  size: A4
  orientation: portrait
  margin: 0

defaults:
  locale: ja-JP

styles:
  tiny:
    fontSize: 7
    color: "#8a94a6"
    lineHeight: 1.3

sections:
  body:
    type: flow
    box: { x: 30, y: 30, w: 535.28, h: 781.89 }
    items:
      - id: labels
        type: repeat
        data: { key: orders }
        grid:
          columns: 2
          rows: 3
          direction: row
          columnGap: 12
          rowGap: 12
        cell:
          # Label frame = cut guide.
          style: { borderColor: "#9aa4b2", borderWidth: 0.5 }
          items:
            - type: image
              box: { x: 10, y: 8, w: 18, h: 18 }
              src: assets/logo.svg
            - type: text
              box: { x: 33, y: 12, w: 130, h: 11 }
              text: 正直堂オンラインストア
              style: { fontSize: 8, color: "#1a3c6e", lineHeight: 1.3 }
            # Shipping-class badge (standard / chilled / book parcel …).
            - type: text
              box: { x: 185.64, y: 8, w: 66, h: 16 }
              data: { key: shipping_class }
              style:
                fontSize: 8.5
                textAlign: center
                verticalAlign: middle
                color: "#ffffff"
                backgroundColor: "#1a3c6e"
                lineHeight: 1.2

            - type: text
              box: { x: 10, y: 34, w: 100, h: 10 }
              text: お届け先
              styleNames: [ tiny ]
            - id: postal_row
              type: container
              box: { x: 10, y: 46, w: 180, h: 18, direction: row, gap: 4, alignItems: center }
              items:
                - { type: text, box: { w: 11 }, text: 〒, style: { fontSize: 9, lineHeight: 1.2 } }
                - type: char_grid
                  box: { w: 42 }
                  data: { key: postal_code1 }
                  grid: { charsPerLine: 3, lines: 1, cellSize: 14 }
                - { type: text, box: { w: 6 }, text: "−", style: { fontSize: 9, textAlign: center, lineHeight: 1.2 } }
                - type: char_grid
                  box: { w: 56 }
                  data: { key: postal_code2 }
                  grid: { charsPerLine: 4, lines: 1, cellSize: 14 }
            - type: text
              box: { x: 10, y: 70, w: 241.64, h: 40 }
              data: { key: address }
              style: { fontSize: 9.5, lineHeight: 1.45 }
            - type: text
              box: { x: 10, y: 112, w: 241.64, h: 19 }
              text: "{name} 様"
              style: { fontSize: 13, lineHeight: 1.4, fontWeight: bold, textOverflow: shrink }

            - type: line
              from: { x: 10, y: 138 }
              to: { x: 251.64, y: 138 }
              style: { width: 0.4, color: "#d4d9e2" }

            - type: text
              box: { x: 10, y: 146, w: 160, h: 11 }
              text: "注文番号 {order_no}"
              style: { fontSize: 8, color: "#555555", lineHeight: 1.3 }
            - type: text
              box: { x: 10, y: 160, w: 160, h: 12 }
              text: "内容点数 {item_count}"
              style: { fontSize: 8.5, lineHeight: 1.3 }
            - id: contents
              type: list
              box: { x: 10, y: 176, w: 150, h: 52 }
              data: { key: items }
              overflowText: 他{count}件
              style: { fontSize: 8, lineHeight: 1.6, color: "#333333" }

            - id: slip_qr
              type: qr_code
              box: { x: 181.64, y: 150, w: 66, h: 66 }
              data: { key: url }
            - type: text
              box: { x: 176.64, y: 218, w: 76, h: 10 }
              text: 配送伝票QR
              style: { fontSize: 6.5, textAlign: center, color: "#8a94a6", lineHeight: 1.3 }

            - type: text
              box: { x: 10, y: 232, w: 241.64, h: 12 }
              data: { key: note }
              style: { fontSize: 8, color: "#b4552d", lineHeight: 1.4 }
