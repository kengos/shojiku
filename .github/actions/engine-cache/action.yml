name: run a make gate with a warm target directory
description: >
  Run one `make` target — the same one a contributor runs — with
  engine/target restored from cache around it. Wrapping the run (rather than
  just the cache) is what keeps the restore/chown/save order correct: the
  toolchain container writes as root, so the save step cannot read what it
  produced until ownership is handed back.

inputs:
  target:
    description: The make target to run, e.g. "engine:coverage" or "sdk:ruby:verify".
    required: true
  key:
    description: >
      A per-job cache suffix. Jobs build different profiles into one target
      directory, so a shared entry means each save evicts work the next job
      needed. One entry per job keeps them independent.
    required: true
  env:
    description: Extra VAR=VALUE arguments appended to the make invocation.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Only engine/target is cached. The toolchain is the pinned image's own
    # (nothing is mounted over it), and cargo's download cache stays a Docker
    # named volume that starts empty on each runner. Compilation output is the
    # expensive part anyway; the registry download is seconds.
    #
    # `cargo-home` in the key: the build's dependency records name the crate
    # sources by path, and that path moved when CARGO_HOME left
    # /usr/local/cargo. An entry saved before would be restored by an exact
    # key match, rebuilt from scratch, and never replaced (a save under an
    # existing key is skipped), until engine/Cargo.lock next changed.
    - uses: actions/cache/restore@v4
      with:
        path: engine/target
        key: engine-${{ inputs.key }}-cargo-home-${{ hashFiles('engine/Cargo.lock') }}
        restore-keys: engine-${{ inputs.key }}-cargo-home-

    - shell: bash
      run: make ${{ inputs.target }} ${{ inputs.env }}

    - name: Hand the target directory back to the runner
      if: always()
      shell: bash
      # Everything the container wrote is root-owned and the save step runs as
      # the runner. Without this the save fails and every run starts cold —
      # silently, because a cache miss is not an error.
      run: sudo chown -R "$(id -u):$(id -g)" engine/target 2>/dev/null || true

    - uses: actions/cache/save@v4
      if: always()
      with:
        path: engine/target
        key: engine-${{ inputs.key }}-cargo-home-${{ hashFiles('engine/Cargo.lock') }}
