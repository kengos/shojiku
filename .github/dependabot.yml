version: 2

# A PR THAT MOVES AN INVENTORIED LOCKFILE IS FIXED FOR YOU. `engine/Cargo.lock`,
# `gui/pnpm-lock.yaml` and `sdk/js/pnpm-lock.yaml` each have a committed
# CycloneDX inventory under `sbom/`, and `make sbom-check` (CI job "sbom")
# reds when one drifts. Dependabot cannot regenerate them — a workflow it
# triggers gets a read-only token and cannot read repository secrets — so
# every such PR used to arrive red and stay red until a human ran
# `make sbom` on the branch. `.github/workflows/sbom-sync.yml` now does
# that and commits the result.
#
# It refuses any PR that touches anything but manifests and lockfiles, which
# is deliberate and covers two ecosystems below: `github-actions` PRs edit
# `.github/workflows/**` and `docker` PRs edit Dockerfiles. Neither moves a
# lockfile, so neither has an SBOM to be stale — nothing is owed there.
# `site/pnpm-lock.yaml` is mapped `-` (not inventoried), so site PRs never
# needed it either. When the workflow declines a PR it says which path
# disqualified it; the fallback is always `make sbom` on the branch.
updates:
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Three Dockerfiles pin the SAME `rust:<X.Y.Z>-slim-bookworm` builder and
  # must move together. All three directories are listed so none is silently
  # left behind (before this, only /docker was tracked and the other two were
  # hand-synced). Of the non-rust base images here, only two are bumpable:
  # `node:26-bookworm-slim` (tag carries a version) and the digest-pinned
  # distroless runtime ref. `nginx:alpine` (×2) is a FLOATING tag with no
  # version to compare, so dependabot will never open a PR for it — pin it to
  # `nginx:<X.Y>-alpine` if you want those tracked.
  #
  # A RUST BUMP ARRIVES AS THREE PRs, ONE PER DOCKERFILE. Dependabot cannot
  # collapse them: single-PR-across-directories needs `group-by:
  # dependency-name`, which supports npm/bundler/composer/mix/maven/pip and
  # NOT docker. The `rust-toolchain` group below therefore only labels the
  # branches/titles so the three are recognizable as one logical bump — merge
  # them together, and revisit this if docker ever gains `group-by`.
  #
  # AND EVERY ONE OF THOSE PRs IS INCOMPLETE. The version lives in FIVE pins;
  # dependabot parses only the three Dockerfiles. The other two are plain
  # variables it cannot see:
  #   - Makefile                 -> RUST_VERSION (drives the local `make` gates)
  #   - .github/workflows/ci.yml -> RUST_VERSION
  # Hand-edit both before merging, or the gates keep building on the old
  # toolchain. Locally the bump also does not take effect until
  # `docker volume rm shojiku-rustup`.
  # The five pins that must move together: `Makefile` (RUST_VERSION),
  # `.github/workflows/ci.yml` (RUST_VERSION), `docker/Dockerfile`,
  # `engine/wasm`'s toolchain, and the wasm-bindgen pin set, which has to
  # match the wasm-bindgen-cli the wasm gate installs.
  #
  # NODE HAS THE SAME SPLIT, in miniature — and it is FIVE pins, not three.
  # A `node:` bump PR touches only `gui/designer-app/Dockerfile`; the ones
  # dependabot cannot see are:
  #   - Makefile                        -> NODE_IMAGE (drives the gui AND site
  #                                        gates — grep it, it is not gui-only)
  #   - gui/package.json                -> engines.node
  #   - site/package.json               -> engines.node
  #   - .devcontainer/devcontainer.json -> image
  # Sync all five, or the gates run a different Node than the image ships.
  #
  # The last two were missing from this list and both went a full major
  # behind unnoticed. The devcontainer is invisible twice over — no directory
  # below covers `.devcontainer`, and the docker ecosystem could not parse a
  # devcontainer.json even if one did. The `site` one hid behind this very
  # comment calling NODE_IMAGE "the local gui gates": it drives the site
  # gates too, so site's floor is a claim those gates stop testing the moment
  # the image moves past it. Find them by SWEEPING (`node:2[0-9]` and
  # `">=2[0-9]"`) rather than by reading this list — the list is what was
  # wrong both times.
  #
  # Two node pins here are deliberately NOT part of that set. `Makefile`'s
  # `NODE_FLOOR_IMAGE` is the node SDK's declared FLOOR (docs/agents/sdk.md:
  # a package that only works on the latest node has not actually supported
  # the version it claims), and `examples/deploy/node/Dockerfile` shows a
  # user what a deployment looks like. Neither follows the gui image.
  #
  # Node tracks LTS here deliberately, so an even-numbered major that is
  # still "Current" is a POLICY decision, not a routine bump — check
  # nodejs.org/en/about/previous-releases before merging one. The 24 → 26
  # bump was taken as a deliberate exception with v26 still in its Current
  # phase; the rule stands for the next one.
  - package-ecosystem: docker
    directories:
      - /docker
      - /engine/wasm/e2e
      - /gui/designer-app
    schedule:
      interval: weekly
    groups:
      rust-toolchain:
        patterns: [rust]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # gui/ is a pnpm workspace (designer, designer-core, designer-app); point at
  # the root that owns pnpm-workspace.yaml + pnpm-lock.yaml and dependabot
  # resolves the member manifests from there (`npm` is also the pnpm key).
  # (Sanity check resolved in practice: a jsdom PR touched only the MEMBER
  # manifests, so member resolution from the root works.)
  # Minor/patch land as one weekly PR — gui deps are the liberal side of the
  # repo's dependency posture, engine deps stay strict — majors come singly.
  #
  # `cooldown` is set to match `minimumReleaseAge` in gui/pnpm-workspace.yaml
  # (7 days). Without it the two fight: dependabot opened PRs within hours of a
  # release, and `make gui` then failed them with
  # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION until the packages aged out — a PR
  # that is red on arrival and silently turns green days later. KEEP THE TWO
  # NUMBERS IN SYNC; lowering only this one brings the red-on-arrival back.
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gui-minor-patch:
        update-types: [minor, patch]

  # site/ and sdk/js/ are STANDALONE pnpm projects (not gui/ workspace members
  # — each owns its own lockfile), and neither was listed here until five npm
  # advisories sat open against them with no PR ever arriving. That is the
  # failure mode to remember: GitHub raises an ALERT for every lockfile it can
  # see, whether or not the directory is configured, but it only opens an
  # update PR for a directory listed below. An untracked project therefore
  # looks monitored — the alerts are real and visible — while nothing is ever
  # going to fix them.
  #
  # Same 7-day cooldown as /gui, and for the same reason: it must match the
  # `minimumReleaseAge` each project sets in its own pnpm-workspace.yaml, or
  # the PR lands red with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION and silently
  # turns green days later once the packages age out.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdk/js
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      sdk-js-minor-patch:
        update-types: [minor, patch]
