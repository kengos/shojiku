name: SBOM sync

# Dependabot moves a lockfile; `make sbom-check` then reds, because the
# committed CycloneDX inventory no longer describes it. Dependabot cannot
# fix that itself, so without this workflow every bump to a lockfile the
# map inventories — engine/Cargo.lock, gui/pnpm-lock.yaml,
# sdk/js/pnpm-lock.yaml — arrives red and stays red until a human runs
# `make sbom` on the branch. (site/pnpm-lock.yaml is mapped `-`, so site
# bumps were always green and still are.)
#
# WHY pull_request_target, AND WHY IT IS SAFE HERE.
#
# A workflow triggered by Dependabot's own `pull_request` event cannot do
# this job: its GITHUB_TOKEN is read-only, and `secrets` resolves to the
# separate Dependabot store rather than to repository secrets.
# `pull_request_target` runs THIS file, from the base branch, in the base
# repository's context, where the App credentials are readable.
#
# That trigger is dangerous when a workflow checks out and EXECUTES
# pull-request-authored code. This one never does:
#
#   * it checks out the BASE sha, so the Makefile, scripts/ and every
#     workflow on disk are the ones already on main;
#   * from the head it takes LOCKFILES ONLY, by explicit path, and syft
#     reads them as data inside a digest-pinned container;
#   * it refuses unless EVERY path the PR touches is a manifest or a
#     lockfile. That deliberately excludes the `github-actions` ecosystem's
#     PRs, which edit .github/workflows/** — they move no lockfile, so they
#     need no SBOM, and they are exactly the shape that would make this job
#     worth attacking.
#
# WHY THE COMMIT GOES THROUGH GraphQL. `main` requires signed commits
# (`required_signatures`, alongside `deletion` and `non_fast_forward`). A
# `git push` from a runner produces an UNSIGNED commit, which fails late
# and misleadingly — at merge, with a message naming no cause.
# `createCommitOnBranch` produces a commit GitHub signs.
#
# WHY AN APP TOKEN RATHER THAN github.token. A push authenticated with
# GITHUB_TOKEN deliberately starts no new workflow run, so the PR would end
# up carrying a fixed tree whose head sha nothing had ever checked. The App
# installation token is not GITHUB_TOKEN, so the commit it creates DOES
# start a CI run — the PR ends green AND checked. The token is scoped to
# `Contents: write` on this repository and expires in an hour, which is why
# an App was chosen over a long-lived PAT (see also RA1: the repo is moving
# the other registries OFF long-lived tokens, not onto more of them).
#
# TERMINATION depends on the job comparing against the PR'S OWN inventory,
# and that is the subtle part. The commit re-fires `synchronize`; the next
# run must then find nothing changed and stop.
#
# It did not, the first time this ran for real. The claim "termination is
# structural" was written here and it was WRONG: the checkout is of BASE, so
# `sbom/` on disk was MAIN's inventory, and regenerating from the head's
# lockfile always differed from it — that difference is the entire reason the
# PR needs syncing. So every run committed, every commit re-fired the
# trigger, and the job never once looked at what it had already written. It
# ran 19 times on one PR before being disabled by hand.
#
# Two things close it, and BOTH are needed. The lockfile step also takes the
# head's copy of each inventory it is about to regenerate, so `make sbom` has
# the PR's own bytes to preserve against. And the regenerate step diffs
# against a snapshot taken before the run rather than against `git`, since
# git measures from base and would report those head-sourced files as
# modified no matter what was decided.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to sync'
        required: true
        type: string

# The job reads; the App token does the one write.
permissions:
  contents: read
  pull-requests: read

# A newer push to the same PR supersedes the run in flight, matching
# ci.yml. Without this, two pushes in quick succession race on
# expectedHeadOid and the loser fails noisily for no reason.
concurrency:
  group: sbom-sync-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  sync:
    name: sync the committed SBOMs onto a dependabot PR
    # `pull_request_target` fires on EVERY pull request to this repository,
    # so without this gate the job would start on human PRs too and red them
    # on the author check below — a failing check on every contribution, for
    # a workflow that had nothing to do. Skipping at the job level reports
    # nothing at all, which is the correct amount.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Base, NOT the PR head. Everything executable in this job comes from
      # here; see the header. persist-credentials is off because nothing in
      # this job pushes over git — the one write is the GraphQL mutation.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          persist-credentials: false

      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -eu
          meta=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
            --jq '{author: .user.login, headSha: .head.sha, headRef: .head.ref, headRepo: .head.repo.full_name, state: .state}')
          author=$(printf '%s' "$meta" | jq -r .author)
          state=$(printf '%s' "$meta" | jq -r .state)
          head_repo=$(printf '%s' "$meta" | jq -r .headRepo)

          # The mutation below names THIS repository and a branch NAME. If the
          # PR's head lived in a fork, that pair would resolve to whatever
          # branch of ours happens to share the name — writing to a branch the
          # PR does not own. Dependabot does not open fork PRs, so this should
          # be unreachable; it costs one comparison and the rest of the design
          # is fail-closed, so it is checked rather than argued about.
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "refusing: #$NUMBER's head is in '$head_repo', not '$GITHUB_REPOSITORY'" >&2
            exit 1
          fi

          # Enforced for workflow_dispatch too. A maintainer dispatching this
          # is a trusted act, but the whole design — base tooling, lockfiles
          # taken by path, a fail-closed file-set guard — assumes a
          # lockfile-only PR. Pointing it at an arbitrary branch would have
          # the App commit somewhere none of that reasoning covers.
          if [ "$author" != "dependabot[bot]" ]; then
            echo "refusing: #$NUMBER is authored by '$author', not dependabot[bot]" >&2
            exit 1
          fi
          if [ "$state" != "open" ]; then
            echo "refusing: #$NUMBER is $state" >&2
            exit 1
          fi

          {
            echo "number=$NUMBER"
            echo "head_sha=$(printf '%s' "$meta" | jq -r .headSha)"
            echo "head_ref=$(printf '%s' "$meta" | jq -r .headRef)"
          } >>"$GITHUB_OUTPUT"

      # FAIL-CLOSED, and the reason this job may hold the App token at all.
      # A refusal exits 0: a docker or github-actions bump legitimately
      # lands here and must not be reported as a broken PR.
      - name: Guard — the PR may touch nothing but manifests and lockfiles
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -eu
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
            --jq '.[].filename' >/tmp/changed.txt

          # A zero-length list is ambiguous — an empty PR and a broken query
          # look identical — so state the input count before judging it.
          changed=$(wc -l </tmp/changed.txt | tr -d ' ')
          echo "changed files: $changed"
          if [ "$changed" -eq 0 ]; then
            echo "refusing: the changed-file query returned nothing, which is not a state a real PR is in" >&2
            exit 1
          fi
          sed 's/^/  /' /tmp/changed.txt

          # `sbom/*.cdx.json` is on the list because it is THIS WORKFLOW'S OWN
          # OUTPUT. Without it, the first sync puts a path on the branch that
          # the next run then refuses — so the intended termination ("nothing
          # changed, commit nothing, stop") was unreachable, and a branch
          # needing a SECOND refresh would sit red forever. Found by running
          # it: the guard declined a real PR naming `sbom/gui.cdx.json` as the
          # single disqualifying path.
          #
          # It widens nothing that matters. These files are generated data,
          # never executed, and the paths this job WRITES come from the base
          # checkout's lockfile map — never from a PR-supplied filename — so
          # admitting them to the read-side allowlist cannot steer a write.
          disallowed=$(grep -Ev '(^sbom/[A-Za-z0-9._-]+\.cdx\.json|(^|/)(Cargo\.(lock|toml)|pnpm-lock\.yaml|package\.json))$' /tmp/changed.txt || true)
          if [ -n "$disallowed" ]; then
            echo "not syncing: the PR touches paths outside the manifest/lockfile allowlist:"
            printf '%s\n' "$disallowed" | sed 's/^/  /'
            echo "proceed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # And it must actually move an INVENTORIED lockfile. The map is the
          # authority on which ones those are; `-` rows are declared
          # not-inventoried and change nothing here.
          scripts/generate-sbom.sh --list | awk '$2 != "-" {print $1}' | sort >/tmp/mapped.txt
          sort /tmp/changed.txt >/tmp/changed-sorted.txt
          comm -12 /tmp/mapped.txt /tmp/changed-sorted.txt >/tmp/touched.txt
          touched=$(wc -l </tmp/touched.txt | tr -d ' ')
          echo "inventoried lockfiles touched: $touched"
          if [ "$touched" -eq 0 ]; then
            echo "not syncing: no inventoried lockfile moved, so no SBOM can be stale"
            echo "proceed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sed 's/^/  /' /tmp/touched.txt

          # CIRCUIT BREAKER. Everything above is reasoning about why this job
          # converges; this is the thing that holds when the reasoning is
          # wrong. It has been wrong once — a run that could not see its own
          # output committed 19 times to one PR and stopped only because a
          # human disabled the workflow.
          #
          # A correct run leaves exactly one of these commits (two if the
          # branch legitimately moved again), so three is already impossible
          # without a defect. Refusing here costs a red-ish log line on a PR
          # that was going to need a human anyway; not refusing costs an
          # unbounded commit stream that nothing else in this repository would
          # notice.
          mine=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/commits" \
            --jq '[.[] | select(.author.login == "shojiku-sbom-sync[bot]")] | length' \
            | awk '{s+=$1} END {print s+0}')
          echo "sync commits already on this branch: $mine"
          if [ "$mine" -ge 3 ]; then
            echo "refusing: $mine sync commits are already on #$NUMBER — this job is looping, not converging." >&2
            echo "  Disable the workflow, find the defect, then \`@dependabot recreate\` to get a clean branch." >&2
            exit 1
          fi

          echo "proceed=true" >>"$GITHUB_OUTPUT"

      # DATA, not code: only the lockfiles the guard just approved, by
      # explicit path, onto a base checkout.
      #
      # Fetched through the contents API rather than `git fetch` + `git
      # checkout FETCH_HEAD -- <path>`. The git route needs credentials on
      # the remote, and this checkout deliberately keeps none; it would
      # therefore work only because the repository happens to be public,
      # which is a property no line here states and nothing would notice
      # changing. The raw media type also has no 1MB ceiling, unlike the
      # JSON `content` field.
      - name: Take the head's lockfiles
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -eu
          take() { # <repo-relative path>
            echo "taking $1 from $HEAD_SHA"
            gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=$HEAD_SHA" \
              --header 'Accept: application/vnd.github.raw' >"$1"
            [ -s "$1" ] || {
              echo "refusing: $1 came back empty at $HEAD_SHA" >&2
              exit 1
            }
          }

          while read -r lock; do
            take "$lock"

            # AND the inventory that describes it. This is what makes the job
            # CONVERGE, and leaving it out is not a missing nicety — it is an
            # infinite loop, observed in production for 19 commits before the
            # workflow was disabled by hand.
            #
            # The checkout is of BASE, so sbom/ on disk is MAIN's inventory.
            # Regenerating from the head's lockfile and comparing against that
            # always reports a change — that difference is the very reason the
            # PR needs syncing — so the job committed, the commit fired
            # `synchronize`, the next run read main's inventory again, and it
            # never once looked at what it had already written. Taking the
            # head's copy is what lets `make sbom` PRESERVE on the second pass
            # and report nothing to commit.
            #
            # Only for the ecosystems whose lockfile we took. The others keep
            # base's lockfile AND base's inventory, which agree, so they
            # preserve — pulling the head's copies of those would re-commit a
            # stale branch's older inventories over main's.
            name=$(scripts/generate-sbom.sh --list | awk -v l="$lock" '$1 == l {print $2}')
            [ -n "$name" ] && [ "$name" != "-" ] || {
              echo "refusing: $lock has no inventory name in the map" >&2
              exit 1
            }
            take "sbom/$name.cdx.json"
          done </tmp/touched.txt
          git status --porcelain

      - name: Regenerate the inventories
        if: steps.guard.outputs.proceed == 'true'
        id: sbom
        run: |
          set -eu
          # Snapshot what is on disk BEFORE regenerating, and diff against
          # THAT — not against git.
          #
          # `git diff` is the wrong instrument here and would reintroduce the
          # loop this job was disabled for. The checkout is of BASE, and the
          # previous step deliberately overwrote some inventories with the
          # HEAD's copies, so git reports those as modified no matter what
          # `make sbom` decides. The question being asked is not "does this
          # differ from main" — it is "did regenerating change anything from
          # what the PR already has", and only a before/after byte comparison
          # answers it.
          before=$(mktemp -d)
          cp sbom/*.cdx.json "$before/"

          make sbom

          : >/tmp/moved.txt
          for f in sbom/*.cdx.json; do
            cmp -s "$f" "$before/$(basename "$f")" || echo "$f" >>/tmp/moved.txt
          done
          moved=$(wc -l </tmp/moved.txt | tr -d ' ')
          echo "inventories that moved: $moved"
          sed 's/^/  /' /tmp/moved.txt
          if [ "$moved" -eq 0 ]; then
            echo "nothing to commit — the committed inventories already describe these lockfiles"
          fi
          echo "moved=$moved" >>"$GITHUB_OUTPUT"

      # Absent secrets SKIP rather than fail, matching how publish-packages
      # treats SPLIT_REPO_TOKEN: a fork, or this repo before the App is
      # installed, should report "not configured", not a red PR.
      #
      # The emptiness test goes through a step-level `env`, not through
      # `secrets.X != ''` directly — same shape as that php job, and for the
      # same reason: the `secrets` context is not one an `if:` can read.
      - name: Mint an installation token
        id: app
        if: >-
          steps.guard.outputs.proceed == 'true' &&
          steps.sbom.outputs.moved != '0' &&
          github.repository_owner == 'kengos' &&
          env.APP_ID != ''
        env:
          APP_ID: ${{ secrets.SBOM_SYNC_APP_ID }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SBOM_SYNC_APP_ID }}
          private-key: ${{ secrets.SBOM_SYNC_PRIVATE_KEY }}

      - name: Commit the refreshed inventories
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -eu
          additions=$(while read -r f; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" \
              '{path: $path, contents: $contents}'
          done </tmp/moved.txt | jq -s '.')

          # A plain single-quoted assignment, not a heredoc: inside a YAML
          # block scalar the terminator's column is decided by YAML's
          # dedent, and `read` would also have to be trusted to return 0 at
          # EOF. Neither risk buys anything for one line.
          #
          # The quotes are single ON PURPOSE — `$input` is GraphQL's own
          # variable syntax and must reach the server unexpanded, which is
          # the one thing shellcheck's SC2016 exists to warn about.
          # shellcheck disable=SC2016
          query='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }'

          # expectedHeadOid is optimistic concurrency, not decoration: if
          # dependabot force-pushed while syft was running, this refuses
          # rather than clobbering the newer head.
          jq -n \
            --arg query "$query" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg oid "$HEAD_SHA" \
            --arg headline "chore(sbom): refresh the committed inventories" \
            --arg body "The lockfile moved in #$NUMBER, so the CycloneDX inventories under sbom/ no longer described it. Regenerated with \`make sbom\`." \
            --argjson additions "$additions" \
            '{query: $query, variables: {input: {
               branch: {repositoryNameWithOwner: $repo, branchName: $branch},
               expectedHeadOid: $oid,
               fileChanges: {additions: $additions},
               message: {headline: $headline, body: $body}
             }}}' >/tmp/mutation.json

          gh api graphql --input /tmp/mutation.json
